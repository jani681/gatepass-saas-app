<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Aaryan House Security</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:system-ui;
}

body{
  background:#0B1220;
  color:white;
}

.header{
  padding:18px;
  text-align:center;
  background:#111A2E;
  box-shadow:0 5px 20px rgba(0,0,0,0.3);
}

.header h1{
  font-size:22px;
}

.header p{
  color:#94A3B8;
  font-size:13px;
  margin-top:4px;
}

.dashboard{
  padding:14px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  margin-bottom:18px;
}

.stat-card{
  background:#111A2E;
  padding:16px;
  border-radius:16px;
  text-align:center;
  box-shadow:0 10px 25px rgba(0,0,0,0.25);
}

.stat-card h2{
  font-size:24px;
  margin-bottom:4px;
}

.stat-card p{
  font-size:12px;
  color:#94A3B8;
}

.search-box{
  margin-bottom:16px;
}

.search-box input{
  width:100%;
  padding:14px;
  border:none;
  border-radius:14px;
  background:#111A2E;
  color:white;
  font-size:14px;
}

.feed{
  display:flex;
  flex-direction:column;
  gap:14px;
}

.card{
  background:#111A2E;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 10px 25px rgba(0,0,0,0.3);
}

.card img{
  width:100%;
  height:220px;
  object-fit:cover;
  background:black;
}

.info{
  padding:14px;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.badge{
  padding:6px 12px;
  border-radius:999px;
  font-size:12px;
  font-weight:600;
}

.unknown{
  background:#EF4444;
}

.known{
  background:#22C55E;
}

.delivery{
  background:#F59E0B;
}

.staff{
  background:#3B82F6;
}

.meta{
  margin-top:10px;
  color:#94A3B8;
  font-size:13px;
  line-height:1.7;
}

.empty{
  text-align:center;
  margin-top:40px;
  color:#94A3B8;
}

</style>
</head>

<body>

<div class="header">
  <h1>🏠 Aaryan House Security</h1>
  <p>Smart AI Security Dashboard</p>
</div>

<div class="dashboard">

  <!-- STATS -->
  <div class="stats">

    <div class="stat-card">
      <h2 id="totalCount">0</h2>
      <p>Total Entries</p>
    </div>

    <div class="stat-card">
      <h2 id="unknownCount">0</h2>
      <p>Unknown Visitors</p>
    </div>

    <div class="stat-card">
      <h2 id="gate1Count">0</h2>
      <p>Gate 1</p>
    </div>

    <div class="stat-card">
      <h2 id="gate2Count">0</h2>
      <p>Gate 2</p>
    </div>

  </div>

  <!-- SEARCH -->
  <div class="search-box">
    <input id="searchInput" type="text" placeholder="Search gate, type or time..." />
  </div>

  <!-- FEED -->
  <div class="feed" id="feed">
    <div class="empty">Waiting for activity...</div>
  </div>

</div>

<script type="module">

/* ================= FIREBASE ================= */

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

import {
  getFirestore,
  collection,
  onSnapshot,
  query
}
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

/* ================= CONFIG ================= */

const firebaseConfig = {
  apiKey: "AIzaSyBuYYn6V3jqUs47fnVFvW1OlCywfyDX6ix0",
  authDomain: "gatepass-saas.firebaseapp.com",
  projectId: "gatepass-saas",
  storageBucket: "gatepass-saas.appspot.com",
  messagingSenderId: "788886920648",
  appId: "1:788886920648:web:acf750800bf8a5b0b4f4fd"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* ================= UI ================= */

const feed = document.getElementById("feed");
const searchInput = document.getElementById("searchInput");

const totalCount = document.getElementById("totalCount");
const unknownCount = document.getElementById("unknownCount");
const gate1Count = document.getElementById("gate1Count");
const gate2Count = document.getElementById("gate2Count");

/* ================= DATA ================= */

let allEntries = [];

/* ================= BADGE ================= */

function badgeClass(type){

  if(type === "known") return "known";
  if(type === "delivery") return "delivery";
  if(type === "staff") return "staff";

  return "unknown";
}

/* ================= RENDER ================= */

function render(data){

  feed.innerHTML = "";

  if(data.length === 0){
    feed.innerHTML = `<div class="empty">No matching results</div>`;
    return;
  }

  data.reverse().forEach(item=>{

    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      <img src="${item.frontSnapshot || ""}" />

      <div class="info">

        <div class="top">
          <h3>${item.gateId || "Unknown Gate"}</h3>

          <div class="badge ${badgeClass(item.visitorType)}">
            ${item.visitorType || "unknown"}
          </div>
        </div>

        <div class="meta">
          ⏱ ${new Date(item.timestamp).toLocaleString()}<br>
          📷 Device: ${item.device || "gate-device"}<br>
          📌 Status: ${item.status || "new"}<br>
          🧠 Confidence: ${item.confidence || 0}
        </div>

      </div>
    `;

    feed.appendChild(card);

  });

}

/* ================= ANALYTICS ================= */

function updateStats(data){

  totalCount.innerText = data.length;

  unknownCount.innerText =
    data.filter(i => i.visitorType === "unknown").length;

  gate1Count.innerText =
    data.filter(i => i.gateId === "Gate 1").length;

  gate2Count.innerText =
    data.filter(i => i.gateId === "Gate 2").length;
}

/* ================= SEARCH ================= */

searchInput.addEventListener("input", ()=>{

  const q = searchInput.value.toLowerCase();

  const filtered = allEntries.filter(item => {

    return (
      (item.gateId || "").toLowerCase().includes(q) ||
      (item.visitorType || "").toLowerCase().includes(q) ||
      (item.timestamp || "").toLowerCase().includes(q)
    );

  });

  render(filtered);

});

/* ================= LIVE LISTENER ================= */

const q = query(collection(db,"alerts"));

onSnapshot(q,(snap)=>{

  allEntries = [];

  snap.forEach(doc=>{
    allEntries.push(doc.data());
  });

  updateStats(allEntries);

  render([...allEntries]);

});

</script>

</body>
</html>
