<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GatePass | Admin Dashboard</title>
    <style>
        :root { --bg: #0b0e14; --surface: #151921; --accent: #00f2fe; --text: #e2e8f0; --border: #1e293b; }
        body { background-color: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: auto; }
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem; }
        input, select { width: 100%; padding: 0.75rem; background: var(--bg); border: 1px solid var(--border); color: white; border-radius: 6px; margin: 10px 0; }
        button { width: 100%; padding: 0.75rem; background: var(--accent); border: none; border-radius: 6px; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Admin Dashboard</h1>
        <div class="card">
            <h3>Building Registration</h3>
            <input type="text" id="bName" placeholder="Building Name">
            <input type="text" id="bCity" placeholder="City">
            <button onclick="registerBuilding()">Register Building</button>
        </div>
        <div class="card">
            <h3>Gate Provisioning</h3>
            <select id="bSelect"><option>Loading buildings...</option></select>
            <input type="text" id="gName" placeholder="Gate Name">
            <button onclick="createGate()">Generate Gate Node</button>
        </div>
    </div>

    <script type="module">
        import { db } from './firebase-config.js';
        import { collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
        
        console.log("Admin: Firebase initialized and ready.");
        
        window.registerBuilding = () => console.log("Register logic pending");
        window.createGate = () => console.log("Gate logic pending");
    </script>
</body>
</html>
