<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Admin Dashboard - Aaryan House</title>

<style>
body{
  margin:0;
  font-family:system-ui;
  background:#0B1220;
  color:white;
}

.header{
  padding:16px;
  background:#111A2E;
  text-align:center;
  font-weight:700;
  font-size:18px;
}

.sub{
  text-align:center;
  font-size:12px;
  color:#94A3B8;
  margin-top:-8px;
  margin-bottom:10px;
}

.container{
  padding:12px;
  display:flex;
  flex-direction:column;
  gap:12px;
}

.card{
  background:#111A2E;
  border-radius:14px;
  padding:12px;
  display:flex;
  gap:12px;
  align-items:center;
  box-shadow:0 10px 25px rgba(0,0,0,0.3);
}

img{
  width:70px;
  height:70px;
  border-radius:10px;
  object-fit:cover;
  background:#000;
}

.badge{
  display:inline-block;
  background:#3B82F6;
  padding:3px 10px;
  border-radius:20px;
  font-size:12px;
  margin-top:4px;
}

.time{
  font-size:12px;
  color:#94A3B8;
}

.empty{
  text-align:center;
  margin-top:50px;
  color:#94A3B8;
}
</style>
</head>

<body>

<div class="header">🏠 Aaryan's House</div>
<div class="sub">Live Security Control Panel</div>

<div class="container" id="list">
  <div class="empty">Waiting for guest activity...</div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, onSnapshot, query, orderBy } 
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

/* ================= FIREBASE ================= */

const firebaseConfig = {
  apiKey: "AIzaSyBuYYn6V3jqUs47fnVFvW1OlCywfyDX6ix0",
  authDomain: "gatepass-saas.firebaseapp.com",
  projectId: "gatepass-saas",
  storageBucket: "gatepass-saas.appspot.com",
  messagingSenderId: "788886920648",
  appId: "1:788886920648:web:acf750800bf8a5b0b4f4fd"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const list = document.getElementById("list");

/* ================= SAFE TIME ================= */

function formatTime(t){
  try{
    if(!t) return "Unknown time";
    return new Date(t).toLocaleString();
  }catch(e){
    return "Invalid time";
  }
}

/* ================= LIVE ALERTS ================= */

const q = query(collection(db,"alerts"));

onSnapshot(q, (snapshot) => {

  list.innerHTML = "";

  if(snapshot.empty){
    list.innerHTML = `<div class="empty">No guest entries yet</div>`;
    return;
  }

  snapshot.forEach(doc => {
    const d = doc.data();

    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      <img src="${d.frontSnapshot || ''}" />
      <div>
        <div><b>Guest Entry</b></div>
        <div class="badge">${d.gateId || "Unknown Gate"}</div>
        <div class="time">${formatTime(d.timestamp)}</div>
      </div>
    `;

    list.appendChild(card);
  });

});

</script>

</body>
</html>
