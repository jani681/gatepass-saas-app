<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GatePass - SaaS Super Admin</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131a2c;
            --primary: #00f2fe;
            --primary-glow: rgba(0, 242, 254, 0.15);
            --success: #00e676;
            --warning: #ffb300;
            --text-main: #ffffff;
            --text-muted: #7e8b9b;
            --input-border: #222f47;
        }
        body {
            background-color: var(--bg-color); color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0; padding: 16px; display: flex; flex-direction: column; align-items: center;
        }
        .app-header { text-align: center; margin: 15px 0 25px 0; width: 100%; max-width: 480px; }
        .app-header h1 {
            font-size: 26px; font-weight: 800; margin: 0 0 6px 0;
            background: linear-gradient(135deg, #ffffff 30%, var(--primary));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .app-header p { color: var(--text-muted); font-size: 13px; margin: 0; }
        .app-card {
            background-color: var(--card-bg); padding: 22px; border-radius: 20px;
            width: 100%; max-width: 480px; margin-bottom: 20px; box-sizing: border-box;
            border: 1px solid #1e293b; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }
        .app-card h3 { margin: 0 0 18px 0; font-size: 16px; font-weight: 700; }
        label { display: block; margin-bottom: 8px; color: var(--text-muted); font-size: 12px; font-weight: 600; }
        input, select {
            width: 100%; padding: 14px; border-radius: 12px; border: 1px solid var(--input-border);
            background-color: #0b0f19; color: #fff; box-sizing: border-box; margin-bottom: 16px; font-size: 14px; outline: none;
        }
        input:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-glow); }
        .app-btn {
            background-color: #00bac7; color: #fff; border: none; padding: 14px;
            border-radius: 12px; font-weight: 700; font-size: 14px; cursor: pointer; width: 100%; text-align: center;
        }
        .app-btn-success { background: linear-gradient(135deg, #00e676, #00b0ff); }
        .result-panel { background: #0b0f19; padding: 16px; border-radius: 14px; margin-top: 15px; border: 1px solid var(--input-border); display: none; }
        .result-panel h4 { margin: 0 0 12px 0; font-size: 13px; color: var(--success); }
        .url-text { color: #fff; background: var(--card-bg); padding: 12px; border-radius: 10px; font-family: monospace; font-size: 12px; word-break: break-all; margin-bottom: 12px; border: 1px solid var(--input-border); }
        .action-copy-btn {
            background: rgba(250,250,250,0.04); color: var(--primary); border: 1px solid rgba(0,242,254,0.25);
            padding: 12px; border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer; width: 100%;
        }
        .infra-list { display: flex; flex-direction: column; gap: 10px; }
        .gate-row {
            background: #0b0f19; padding: 14px 16px; border-radius: 12px;
            display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--input-border);
        }
        .gate-title { font-weight: 600; font-size: 14px; }
        .gate-meta { font-size: 11px; color: var(--text-muted); font-family: monospace; }
        .portal-badge-link {
            color: var(--primary); font-size: 12px; text-decoration: none; font-weight: 700;
            background: var(--primary-glow); padding: 6px 12px; border-radius: 20px; border: 1px solid rgba(0, 242, 254, 0.2);
        }
    </style>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>
<body>
    <div class="app-header">
        <h1>SaaS Control Room</h1>
        <p>Manage Infrastructure & Gate Portals</p>
    </div>
    <div class="app-card">
        <h3 style="color: var(--primary);">🏢 Setup New Account</h3>
        <label>Building / Client Name</label>
        <input type="text" id="bName" placeholder="e.g., Ali Campus or Ideal Salon">
        <label>Location City</label>
        <input type="text" id="bCity" placeholder="e.g., Adhi Kot">
        <button class="app-btn" onclick="registerBuilding()">Create SaaS Account</button>
    </div>
    <div class="app-card">
        <h3 style="color: var(--success);">🔑 Add Gate Station</h3>
        <label>Select Target Account</label>
        <select id="accountSelect"><option value="">-- Loading Active Clients --</option></select>
        <label>Gate Station Name</label>
        <input type="text" id="gateNameInput" placeholder="e.g., Main Gate, Reception Desk">
        <button class="app-btn app-btn-success" onclick="createGate()">Provision Gate Link</button>
        
        <div class="result-panel" id="qrResultBox">
            <h4>🎉 Provisioning Matrix Generated</h4>
            <div class="url-text" id="generatedUrl"></div>
            <div class="url-text" id="generatedDashUrl"></div>
            <button class="action-copy-btn" onclick="copyLinks()">📋 Copy Configuration Payload</button>
        </div>
    </div>
    <div class="app-card">
        <h3 style="color: var(--warning);">⚡ Active Gates Infrastructure</h3>
        <div class="infra-list" id="gatesList"></div>
    </div>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBuYYn6V3jqUs47fnVfW1OlCywfyDX6ix0",
            authDomain: "gatepass-saas.firebaseapp.com",
            projectId: "gatepass-saas",
            storageBucket: "gatepass-saas.firebasestorage.app",
            messagingSenderId: "788886920648",
            appId: "1:788886920648:web:acf750800bf8a5b0b4f4fd"
        };
        firebase.initializeApp(firebaseConfig); const db = firebase.firestore();
        
        function listenBuildings() {
            db.collection("users").onSnapshot((snap) => {
                const select = document.getElementById("accountSelect");
                select.innerHTML = '<option value="">-- Select Account --</option>';
                snap.forEach((doc) => {
                    const data = doc.data(); const option = document.createElement("option");
                    option.value = doc.id; option.text = `${data.buildingName} (${data.city})`;
                    select.appendChild(option);
                });
            });
        }
        function listenGatesList() {
            db.collection("gates").onSnapshot((snap) => {
                const container = document.getElementById("gatesList"); container.innerHTML = "";
                if (snap.empty) { container.innerHTML = "<p style='color:var(--text-muted);font-size:13px;text-align:center;'>No nodes provisioned.</p>"; return; }
                snap.forEach((doc) => {
                    const data = doc.data(); const div = document.createElement("div"); div.className = "gate-row";
                    const gateLink = `https://gatepass-saas-app.vercel.app/?id=${data.accountId}&gate=${encodeURIComponent(data.gateName)}`;
                    div.innerHTML = `<div><div class="gate-title">${data.gateName}</div><div class="gate-meta">ID: ${data.accountId.substring(0,6)}</div></div><a href="${gateLink}" target="_blank" class="portal-badge-link">Launch Node ⚡</a>`;
                    container.appendChild(div);
                });
            });
        }
        function registerBuilding() {
            const name = document.getElementById("bName").value.trim(); const city = document.getElementById("bCity").value.trim();
            if (!name || !city) return alert("Required parameters missing!");
            db.collection("users").add({ buildingName: name, city: city, timestamp: new Date().toLocaleString() })
            .then(() => { document.getElementById("bName").value = ""; document.getElementById("bCity").value = ""; });
        }
        function createGate() {
            const accountId = document.getElementById("accountSelect").value; const gateName = document.getElementById("gateNameInput").value.trim();
            if (!accountId || !gateName) return alert("Select configuration data fields!");
            db.collection("gates").add({ accountId: accountId, gateName: gateName, timestamp: new Date().toLocaleString() })
            .then(() => {
                const guestUrl = `https://gatepass-saas-app.vercel.app/?id=${accountId}&gate=${encodeURIComponent(gateName)}`;
                const dashUrl = `https://gatepass-saas-app.vercel.app/dashboard.html?id=${accountId}`;
                document.getElementById("qrResultBox").style.display = "block";
                document.getElementById("generatedUrl").innerText = "Guest Link: " + guestUrl;
                document.getElementById("generatedDashUrl").innerText = "Dashboard Link: " + dashUrl;
                document.getElementById("gateNameInput").value = "";
            });
        }
        function copyLinks() {
            const guest = document.getElementById("generatedUrl").innerText; const dash = document.getElementById("generatedDashUrl").innerText;
            navigator.clipboard.writeText(`${guest}\n${dash}`).then(() => alert("Copied successfully!"));
        }
        listenBuildings(); listenGatesList();
    </script>
</body>
</html>
