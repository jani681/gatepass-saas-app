<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GatePass | Admin Dashboard</title>
    <style>
        :root {
            --bg: #0b0e14;
            --surface: #151921;
            --accent: #00f2fe;
            --text: #e2e8f0;
            --text-muted: #64748b;
            --border: #1e293b;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
        }

        /* Navbar */
        nav {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo { font-weight: 800; color: var(--accent); font-size: 1.25rem; }

        /* Container */
        .container { max-width: 900px; margin: 2rem auto; padding: 0 1rem; }

        /* Dashboard Grid */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
        @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }

        /* Cards */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
        }
        h2 { font-size: 1.1rem; margin-top: 0; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }

        /* Form Elements */
        .form-group { margin-bottom: 1rem; }
        label { display: block; font-size: 0.85rem; margin-bottom: 0.5rem; }
        input, select {
            width: 100%; padding: 0.75rem; background: var(--bg);
            border: 1px solid var(--border); border-radius: 6px; color: white;
        }
        button {
            width: 100%; padding: 0.75rem; background: var(--accent);
            color: var(--bg); border: none; border-radius: 6px; font-weight: 700; cursor: pointer;
        }

        /* Table */
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th { text-align: left; color: var(--text-muted); font-size: 0.8rem; padding: 0.5rem; }
        td { padding: 1rem 0.5rem; border-top: 1px solid var(--border); }

        /* States */
        .empty-state { text-align: center; color: var(--text-muted); padding: 2rem; }
        .loading { color: var(--accent); }
    </style>
</head>
<body>

<nav>
    <div class="logo">GATEPASS.SAAS</div>
    <div>Admin Panel</div>
</nav>

<div class="container">
    <div class="grid">
        <div class="card">
            <h2>Building Registration</h2>
            <div class="form-group">
                <label>Building Name</label>
                <input type="text" id="bName" placeholder="e.g. Apex Towers">
            </div>
            <div class="form-group">
                <label>City</label>
                <input type="text" id="bCity" placeholder="e.g. New York">
            </div>
            <button onclick="registerBuilding()">Register Building</button>
        </div>

        <div class="card">
            <h2>Gate Provisioning</h2>
            <div class="form-group">
                <label>Select Building</label>
                <select id="bSelect"><option>Loading buildings...</option></select>
            </div>
            <div class="form-group">
                <label>Gate Name</label>
                <input type="text" id="gName" placeholder="e.g. Main Entrance">
            </div>
            <button onclick="createGate()">Generate Gate Node</button>
        </div>
    </div>

    <div class="card" style="margin-top: 1.5rem;">
        <h2>Deployed Infrastructure</h2>
        <table id="gateTable">
            <thead>
                <tr>
                    <th>Building</th>
                    <th>Gate Name</th>
                    <th>Node ID</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                </tbody>
        </table>
        <div id="emptyState" class="empty-state">No gates provisioned yet.</div>
    </div>
</div>

<script>
    // Placeholder logic for future integration
    function registerBuilding() {
        console.log("Registering building...");
        // Firebase logic will go here
    }

    function createGate() {
        console.log("Provisioning gate...");
        // Firebase logic will go here
    }

    // Initialize UI states
    window.onload = () => {
        console.log("Dashboard initialized.");
        // Check for existing data and update DOM
    };
</script>

</body>
</html>
