<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Gate Security App</title>
    <style>
        body { font-family: sans-serif; background: #1a1a1a; color: white; text-align: center; padding: 20px; }
        .btn { padding: 15px; margin: 10px; width: 80%; border-radius: 10px; border: none; background: #4f46e5; color: white; font-weight: bold; }
        #video { width: 100%; border-radius: 10px; display: none; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Gate Security</h1>
        <button class="btn" onclick="setupSystem()">1. SETUP PERMISSIONS</button>
        <button class="btn" onclick="runCompleteScan()">2. START SCANNING</button>
        <video id="video" autoplay playsinline muted></video>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const db = getFirestore(initializeApp({
            apiKey: "AIzaSyBuYYn6V3jqUs47fnVfW1OlCywfyDX6ix0",
            projectId: "gatepass-saas",
            messagingSenderId: "788886920648",
            appId: "1:788886920648:web:acf750800bf8a5b0b4f4fd"
        }));

        // Permissions Setup
        window.setupSystem = async () => {
            await Notification.requestPermission();
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            stream.getTracks().forEach(t => t.stop());
            alert("Permissions Configured!");
        };

        // Complete Scan Logic
        window.runCompleteScan = async () => {
            const video = document.getElementById('video');
            const canvas = document.createElement('canvas');
            
            // 1. Camera Start
            video.style.display = 'block';
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: { ideal: "environment" } } 
            });
            video.srcObject = stream;

            // 2. Snapshot Logic
            setTimeout(async () => {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                canvas.getContext('2d').drawImage(video, 0, 0);

                // 3. Upload
                await addDoc(collection(db, "logs"), {
                    timestamp: new Date(),
                    snapshot: canvas.toDataURL('image/jpeg')
                });

                // 4. Cleanup (Camera off)
                stream.getTracks().forEach(t => t.stop());
                video.style.display = 'none';

                // 5. Notification (Stream band hone ke baad)
                setTimeout(() => {
                    if(Notification.permission === "granted") {
                        new Notification("Gate Alert", { body: "Guest Entry Captured!" });
                    }
                }, 100);
            }, 2000);
        };
    </script>
</body>
</html>
