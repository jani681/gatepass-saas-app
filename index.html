<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Home Security Dashboard</title>

<style>
body{
  margin:0;
  font-family:system-ui;
  background:#0B1220;
  color:white;
}

.header{
  padding:16px;
  background:#111A2E;
  text-align:center;
  font-weight:700;
  font-size:18px;
}

.container{
  padding:14px;
  display:flex;
  flex-direction:column;
  gap:12px;
}

.card{
  background:#111A2E;
  border-radius:16px;
  padding:12px;
  box-shadow:0 10px 25px rgba(0,0,0,0.3);
}

.row{
  display:flex;
  gap:12px;
  align-items:center;
}

img{
  width:80px;
  height:80px;
  border-radius:12px;
  object-fit:cover;
  background:#000;
}

.badge{
  display:inline-block;
  padding:4px 10px;
  background:#3B82F6;
  border-radius:20px;
  font-size:12px;
  margin-top:6px;
}

.time{
  font-size:12px;
  color:#94A3B8;
}

.empty{
  text-align:center;
  color:#94A3B8;
  margin-top:50px;
}
</style>
</head>

<body>

<div class="header">
🏠 Aaryan's House - Live Security Monitor
</div>

<div class="container" id="list">
  <div class="empty">Waiting for guest alerts...</div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, onSnapshot, query, orderBy } 
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

/* ================= FIREBASE ================= */

const firebaseConfig = {
  apiKey: "AIzaSyBuYYn6V3jqUs47fnVFvW1OlCywfyDX6ix0",
  authDomain: "gatepass-saas.firebaseapp.com",
  projectId: "gatepass-saas",
  storageBucket: "gatepass-saas.appspot.com",
  messagingSenderId: "788886920648",
  appId: "1:788886920648:web:acf750800bf8a5b0b4f4fd"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const list = document.getElementById("list");

/* ================= LIVE LISTENER ================= */

const q = query(collection(db, "alerts"));

onSnapshot(q, (snapshot) => {

  list.innerHTML = "";

  if(snapshot.empty){
    list.innerHTML = `<div class="empty">No alerts yet</div>`;
    return;
  }

  snapshot.forEach((doc) => {
    const d = doc.data();

    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      <div class="row">
        <img src="${d.frontSnapshot}" />
        <div>
          <div><b>Guest Entry</b></div>
          <div class="badge">${d.gateId}</div>
          <div class="time">${new Date(d.timestamp).toLocaleString()}</div>
        </div>
      </div>
    `;

    list.appendChild(card);
  });

});

</script>

</body>
</html>
