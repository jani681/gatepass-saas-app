<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aaryan's House Security</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f4f4f9; padding: 20px; }
        .card { background: white; padding: 20px; border-radius: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .btn { width: 100%; padding: 20px; border-radius: 15px; border: none; background: #6366f1; color: white; font-weight: bold; margin-bottom: 10px; cursor: pointer; }
        #video { width: 100%; border-radius: 15px; display: none; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Aaryan's House</h1>
        <button class="btn" onclick="startScanner()">SCAN QR TO ENTER</button>
        <video id="video" autoplay playsinline></video>
        <canvas id="canvas" style="display:none;"></canvas>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const db = getFirestore(initializeApp({
            apiKey: "AIzaSyBuYYn6V3jqUs47fnVfW1OlCywfyDX6ix0",
            projectId: "gatepass-saas",
            // ...config
        }));

        window.startScanner = async () => {
            const video = document.getElementById('video');
            video.style.display = 'block';
            
            // Camera On
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
            video.srcObject = stream;

            // 3 seconds baad snapshot capture
            setTimeout(async () => {
                const canvas = document.getElementById('canvas');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                canvas.getContext('2d').drawImage(video, 0, 0);
                
                // Snapshot le liya, ab Firestore mein push karein
                const imageBase64 = canvas.toDataURL('image/jpeg');
                await addDoc(collection(db, "logs"), {
                    timestamp: serverTimestamp(),
                    snapshot: imageBase64,
                    gate: "Main Gate", // Isay hum dynamic karenge
                    action: "Guest Entry"
                });
                
                alert("Alert sent to Aaryan's family!");
                video.style.display = 'none';
                stream.getTracks().forEach(track => track.stop());
            }, 3000);
        };
    </script>
</body>
</html>
