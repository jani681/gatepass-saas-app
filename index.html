<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8" />

<meta name="viewport"
content="width=device-width, initial-scale=1.0"/>

<title>Gate Device - Aaryan House</title>

<meta name="theme-color" content="#0B1220"/>

<link rel="manifest" href="manifest.json"/>

<link rel="apple-touch-icon"
href="https://cdn-icons-png.flaticon.com/512/6195/6195700.png"/>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:system-ui;
}

body{
  background:#0B1220;
  color:white;
  display:flex;
  justify-content:center;
}

.app{
  width:100%;
  max-width:420px;
  padding:16px;
}

.card{
  background:#111A2E;
  border-radius:18px;
  padding:16px;
  margin-top:20px;
  box-shadow:0 10px 25px rgba(0,0,0,0.35);
}

h2{
  font-size:24px;
}

.sub{
  color:#94A3B8;
  margin-top:4px;
  font-size:13px;
}

video{
  width:100%;
  border-radius:14px;
  background:black;
  margin-top:10px;
  aspect-ratio:3/4;
  object-fit:cover;
}

button{
  width:100%;
  margin-top:14px;
  padding:16px;
  border:none;
  border-radius:14px;
  background:#3B82F6;
  color:white;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

button:disabled{
  opacity:0.7;
}

.status{
  margin-top:14px;
  text-align:center;
  font-size:13px;
  color:#94A3B8;
  min-height:20px;
}

.gate-badge{
  margin-top:12px;
  display:inline-block;
  padding:6px 12px;
  background:#1E293B;
  border-radius:999px;
  font-size:12px;
  color:#93C5FD;
}

.install-btn{
  background:#16A34A;
}

</style>
</head>

<body>

<div class="app">

  <h2>🚪 Gate Scanner</h2>

  <div class="sub">
    Aaryan's House Security System
  </div>

  <div class="gate-badge" id="gateLabel">
    Detecting Gate...
  </div>

  <div class="card">

    <video id="video" autoplay playsinline muted></video>

    <canvas id="canvas" style="display:none;"></canvas>

    <button id="scanBtn">
      Scan Guest
    </button>

    <button
      id="installBtn"
      class="install-btn"
      style="display:none;"
    >
      Install App
    </button>

    <div class="status" id="status">
      Ready
    </div>

  </div>

</div>

<script type="module">

/* ================= FIREBASE ================= */

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

import {
  getFirestore,
  collection,
  addDoc,
  serverTimestamp
}
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

import {
  getMessaging,
  getToken
}
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-messaging.js";

/* ================= CONFIG ================= */

const firebaseConfig = {
  apiKey: "AIzaSyBuYYn6V3jqUs47fnVfW1OlCywfyDX6ix0",
  authDomain: "gatepass-saas.firebaseapp.com",
  projectId: "gatepass-saas",
  storageBucket: "gatepass-saas.appspot.com",
  messagingSenderId: "788886920648",
  appId: "1:788886920648:web:acf750800bf8a5b0b4f4fd"
};

const VAPID_PUBLIC_KEY =
"BMT6w2SjY_C35I8Wf_X0t918Sg7I7I2x5vG90F_R3u7m1vP8N7W3W8O_T9g1K5O8V9x2X6L5P8I8M8Q8M3K4J8";

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const messaging = getMessaging(app);

/* ================= UI ================= */

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const btn = document.getElementById("scanBtn");
const status = document.getElementById("status");
const gateLabel = document.getElementById("gateLabel");
const installBtn = document.getElementById("installBtn");

/* ================= STATE ================= */

let stream = null;
let running = false;
let deferredPrompt = null;

/* ================= HELPERS ================= */

const wait = (ms) => new Promise(r => setTimeout(r, ms));

function setStatus(text){
  status.innerText = text;
}

/* ================= GATE DETECTION ================= */

function getGateId(){

  const gate = new URLSearchParams(location.search).get("gate");

  if(gate === "1") return "Gate 1";
  if(gate === "2") return "Gate 2";

  return "Unknown Gate";
}

const CURRENT_GATE = getGateId();

gateLabel.innerText = CURRENT_GATE;

/* ================= PUSH NOTIFICATION ENGINE ================= */

async function setupPushNotifications() {

  if (!("Notification" in window)) return;

  try {

    const permission = await Notification.requestPermission();

    if (permission === "granted") {

      const currentToken = await getToken(messaging, {
        vapidKey: VAPID_PUBLIC_KEY
      });

      if (currentToken) {

        console.log(
          "Web Push Channel Active. Token:",
          currentToken
        );

      } else {

        console.warn(
          "No registration token available."
        );
      }
    }

  } catch (err) {

    console.error(
      "An error occurred while retrieving token:",
      err
    );
  }
}

window.addEventListener(
  "DOMContentLoaded",
  setupPushNotifications
);

/* ================= LOCAL NOTIFICATION ================= */

function triggerNotification(){

  setTimeout(()=>{

    try{

      if(Notification.permission === "granted"){

        new Notification("Gate Alert!",{
          body:
          `${CURRENT_GATE}: Guest entry captured successfully.`,
          icon:
          "https://cdn-icons-png.flaticon.com/512/6195/6195700.png",
          badge:
          "https://cdn-icons-png.flaticon.com/512/6195/6195700.png",
          vibrate:[200,100,200],
          tag:"gate-alert",
          renotify:true
        });

      }

    }catch(err){

      console.error(
        "Notification dispatch failed:",
        err
      );
    }

  },10);

}

/* ================= PWA INSTALL ================= */

window.addEventListener("beforeinstallprompt",(e)=>{

  e.preventDefault();

  deferredPrompt = e;

  installBtn.style.display = "block";

});

installBtn.addEventListener("click",async()=>{

  if(!deferredPrompt) return;

  deferredPrompt.prompt();

  await deferredPrompt.userChoice;

  deferredPrompt = null;

  installBtn.style.display = "none";

});

/* ================= SERVICE WORKER ================= */

if("serviceWorker" in navigator){

  window.addEventListener("load",()=>{

    navigator.serviceWorker.register("./sw.js")
    .then(()=>{
      console.log("SW Registered");
    })
    .catch(err=>{
      console.error(err);
    });

  });

}

/* ================= CAMERA ================= */

async function stopCam(){

  if(stream){
    stream.getTracks().forEach(track => track.stop());
  }

  stream = null;

  video.pause();

  video.srcObject = null;

  await wait(300);
}

async function startCam(mode){

  await stopCam();

  stream = await navigator.mediaDevices.getUserMedia({
    video:{
      facingMode:{
        ideal: mode
      },
      width:{ ideal:480 },
      height:{ ideal:640 }
    },
    audio:false
  });

  video.srcObject = stream;

  await video.play();

  await wait(300);
}

/* ================= IMAGE CAPTURE ================= */

function capture(){

  const ctx = canvas.getContext("2d");

  const width = 240;
  const height = 320;

  canvas.width = width;
  canvas.height = height;

  ctx.drawImage(video,0,0,width,height);

  return canvas.toDataURL("image/jpeg",0.25);
}

/* ================= MAIN ENGINE ================= */

async function scan(){

  if(running) return;

  running = true;

  btn.disabled = true;

  try{

    /* REAR CAMERA */

    setStatus("Opening rear camera...");

    await startCam("environment");

    await wait(2000);

    const rearSnapshot = capture();

    await stopCam();

    await wait(500);

    /* FRONT CAMERA */

    setStatus("Capturing guest face...");

    await startCam("user");

    await wait(1800);

    const frontSnapshot = capture();

    await stopCam();

    /* DATA */

    const data = {

      timestamp: serverTimestamp(),

      gateId: CURRENT_GATE,

      rearSnapshot:
      rearSnapshot.substring(0,150000),

      frontSnapshot:
      frontSnapshot.substring(0,150000),

      action:"Guest Entry",

      visitorType:"unknown",

      confidence:0,

      status:"new",

      device:"gate-device"
    };

    /* FIREBASE */

    setStatus("Uploading to database...");

    await addDoc(collection(db,"logs"),data);

    await addDoc(collection(db,"alerts"),data);

    /* SUCCESS */

    setStatus("Entry Recorded ✔");

    triggerNotification();

    alert("Guest captured successfully");

  }catch(err){

    console.error(err);

    setStatus("Error uploading data ❌");

    alert(err.message);

    await stopCam();
  }

  running = false;

  btn.disabled = false;
}

/* ================= EVENT ================= */

btn.addEventListener("click",scan);

</script>

</body>
</html>
