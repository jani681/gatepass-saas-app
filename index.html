<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Gate Security System</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0f172a;
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: #1e293b;
      border-radius: 18px;
      padding: 25px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }

    h1 {
      font-size: 24px;
      margin-bottom: 10px;
    }

    p {
      color: #cbd5e1;
      font-size: 14px;
      margin-bottom: 20px;
    }

    #video {
      width: 100%;
      border-radius: 14px;
      background: black;
      display: none;
      margin-bottom: 15px;
      object-fit: cover;
    }

    canvas {
      display: none;
    }

    .status {
      margin: 15px 0;
      font-size: 14px;
      color: #93c5fd;
      min-height: 20px;
    }

    button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }

    button:disabled {
      background: #475569;
    }

    .success { color: #4ade80; }
    .error { color: #f87171; }
  </style>
</head>

<body>

<div class="container">
  <h1>Gate Security System</h1>
  <p>Aaryan's House</p>

  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>

  <div class="status" id="status">Ready</div>

  <button id="scanBtn">Scan Guest</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getMessaging, getToken } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-messaging.js";

const firebaseConfig = {
  apiKey: "AIzaSyBuYYn6V3jqUs47fnVfW1OlCywfyDX6ix0",
  authDomain: "gatepass-saas.firebaseapp.com",
  projectId: "gatepass-saas",
  storageBucket: "gatepass-saas.appspot.com",
  messagingSenderId: "788886920648",
  appId: "1:788886920648:web:acf750800bf8a5b0b4f4fd"
};

const VAPID_PUBLIC_KEY = "BMT6w2SjY_C35I8Wf_X0t918Sg7I7I2x5vG90F_R3u7m1vP8N7W3W8O_T9g1K5O8V9x2X6L5P8I8M8Q8M3K4J8";

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const messaging = getMessaging(app);

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const status = document.getElementById("status");
const btn = document.getElementById("scanBtn");

let stream = null;
let running = false;

function setStatus(t) {
  status.textContent = t;
}

function wait(ms) {
  return new Promise(r => setTimeout(r, ms));
}

/* =========================
   NOTIFICATION SYSTEM FIX
========================= */

function initNotificationSystem() {
  if ("Notification" in window) {
    Notification.requestPermission().then((permission) => {
      if (permission === "granted") {
        try {
          getToken(messaging, { vapidKey: VAPID_PUBLIC_KEY })
            .then((currentToken) => {
              if (currentToken) {
                console.log("Push Channel Secure:", currentToken);
              }
            })
            .catch((err) => console.error("VAPID Registration failed:", err));
        } catch (e) {
          console.error(e);
        }
      }
    });
  }
}

window.addEventListener("click", initNotificationSystem, { once: true });
window.addEventListener("load", initNotificationSystem);

/* =========================
   CAMERA CONTROL
========================= */

async function stopCamera() {
  if (stream) {
    stream.getTracks().forEach(t => t.stop());
  }
  stream = null;
  video.srcObject = null;
  video.pause();
  video.style.display = "none";
  await wait(300);
}

async function startCamera(mode) {
  await stopCamera();

  const s = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: { ideal: mode } },
    audio: false
  });

  stream = s;
  video.srcObject = s;
  video.style.display = "block";
  await video.play();
  await wait(200);
}

function capture() {
  const ctx = canvas.getContext("2d");
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  ctx.drawImage(video, 0, 0);
  return canvas.toDataURL("image/jpeg", 0.85);
}

/* =========================
   NOTIFICATION TRIGGER
========================= */

function triggerNotification() {
  setTimeout(() => {
    if (Notification.permission === "granted") {
      try {
        new Notification("Gate Alert!", {
          body: "Naya guest entry captured hua hai!",
          icon: "https://cdn-icons-png.flaticon.com/512/6195/6195700.png",
          tag: "gate-entry-alert",
          renotify: true
        });
      } catch (e) {
        console.error("Local notification fallback triggered:", e);
      }
    }
  }, 50);
}

/* =========================
   MAIN FLOW (UNCHANGED LOGIC)
========================= */

async function run() {
  if (running) return;
  running = true;
  btn.disabled = true;

  let rearSnapshot = "";
  let frontSnapshot = "";

  try {

    setStatus("Opening rear camera...");
    await startCamera("environment");
    await wait(2000);
    rearSnapshot = capture();
    await stopCamera();

    await wait(500);

    setStatus("Capturing guest face...");
    await startCamera("user");
    await wait(1800);
    frontSnapshot = capture();
    await stopCamera();

    setStatus("Uploading to database...");

    await addDoc(collection(db, "logs"), {
      timestamp: new Date(),
      rearSnapshot,
      frontSnapshot,
      action: "Guest Entry"
    });

    setStatus("Done", "success");

    triggerNotification();

  } catch (e) {
    console.error(e);
    setStatus("Error", "error");
    await stopCamera();
  }

  running = false;
  btn.disabled = false;
}

btn.addEventListener("click", run);

</script>

</body>
</html>
