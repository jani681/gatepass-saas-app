<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aaryan's Security</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f9; padding: 20px; text-align: center; }
        .card { background: white; padding: 20px; border-radius: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .btn { width: 100%; padding: 20px; border-radius: 15px; border: none; background: #6366f1; color: white; font-weight: bold; cursor: pointer; }
        #video { width: 100%; border-radius: 15px; display: none; margin-top: 10px; }
    </style>
</head>
<body onload="requestNotificationPermission()">

    <div class="card">
        <h1>Aaryan's House</h1>
        <button class="btn" id="startBtn" onclick="processEntry()">START SCANNING</button>
        <video id="video" autoplay playsinline></video>
        <canvas id="canvas" style="display:none;"></canvas>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBuYYn6V3jqUs47fnVfW1OlCywfyDX6ix0",
            projectId: "gatepass-saas",
            messagingSenderId: "788886920648",
            appId: "1:788886920648:web:acf750800bf8a5b0b4f4fd"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 1. Permission Auto-Request
        window.requestNotificationPermission = async () => {
            if (Notification.permission !== "granted") {
                await Notification.requestPermission();
            }
        };

        // 2. Main Scanner Logic
        window.processEntry = async () => {
            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');
            video.style.display = 'block';
            
            // Rear camera without 'exact' to ensure compatibility
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment" } 
                });
                video.srcObject = stream;
            } catch (err) {
                alert("Camera access error: " + err.message);
                return;
            }
            
            setTimeout(async () => {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                canvas.getContext('2d').drawImage(video, 0, 0);
                
                await addDoc(collection(db, "logs"), {
                    timestamp: new Date(),
                    snapshot: canvas.toDataURL('image/jpeg'),
                    action: "Guest Entry"
                });
                
                // Stream stop
                video.srcObject.getTracks().forEach(t => t.stop());
                video.style.display = 'none';
                
                // Notification (Delay ke saath taaki browser focus mil jaye)
                setTimeout(() => {
                    if (Notification.permission === "granted") {
                        new Notification("Gate Alert!", { 
                            body: "Naya guest scan hua hai!",
                            icon: "https://cdn-icons-png.flaticon.com/512/2991/2991148.png"
                        });
                    }
                }, 500);
                
                alert("Snapshot saved!");
            }, 3000);
        };
    </script>
</body>
</html>
