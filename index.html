<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Gate Device - Aaryan House</title>

<style>
body{
  margin:0;
  font-family:system-ui;
  background:#0B1220;
  color:white;
  display:flex;
  justify-content:center;
}

.app{
  width:100%;
  max-width:420px;
  padding:16px;
}

.card{
  background:#111A2E;
  border-radius:16px;
  padding:16px;
  margin-top:20px;
  box-shadow:0 10px 25px rgba(0,0,0,0.4);
}

video{
  width:100%;
  border-radius:14px;
  background:black;
}

button{
  width:100%;
  margin-top:12px;
  padding:14px;
  border:none;
  border-radius:12px;
  background:#3B82F6;
  color:white;
  font-size:16px;
  font-weight:600;
}

.status{
  margin-top:10px;
  text-align:center;
  font-size:13px;
  color:#94A3B8;
}
</style>
</head>

<body>

<div class="app">

  <h2>🚪 Gate Scanner</h2>
  <p style="color:#94A3B8;font-size:13px;">Aaryan's House Security System</p>

  <div class="card">
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <button id="scanBtn">Scan Guest</button>
    <div class="status" id="status">Ready</div>
  </div>

</div>

<script type="module">

/* ================= FIREBASE ================= */

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc } 
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

/* ================= CONFIG ================= */

const firebaseConfig = {
  apiKey: "AIzaSyBuYYn6V3jqUs47fnVFvW1OlCywfyDX6ix0",
  authDomain: "gatepass-saas.firebaseapp.com",
  projectId: "gatepass-saas",
  storageBucket: "gatepass-saas.appspot.com",
  messagingSenderId: "788886920648",
  appId: "1:788886920648:web:acf750800bf8a5b0b4f4fd"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* ================= UI ================= */

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const btn = document.getElementById("scanBtn");
const status = document.getElementById("status");

/* ================= STATE ================= */

let stream = null;
let running = false;

/* ================= HELPERS ================= */

const wait = (ms)=>new Promise(r=>setTimeout(r,ms));

function setStatus(t){
  status.textContent = t;
}

/* ================= GATE ID ================= */

function getGateId(){
  const g = new URLSearchParams(location.search).get("gate");
  if(g==="1") return "Gate 1";
  if(g==="2") return "Gate 2";
  return "Unknown Gate";
}

/* ================= CAMERA CONTROL ================= */

async function stopCam(){
  if(stream){
    stream.getTracks().forEach(t=>t.stop());
  }
  stream = null;
  video.srcObject = null;
}

async function startCam(mode){

  await stopCam();

  stream = await navigator.mediaDevices.getUserMedia({
    video:{ facingMode:{ ideal: mode } },
    audio:false
  });

  video.srcObject = stream;
  await video.play();
  await wait(200);
}

function capture(){
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext("2d").drawImage(video,0,0);
  return canvas.toDataURL("image/jpeg",0.85);
}

/* ================= STEP 6 SCAN ENGINE ================= */

async function scan(){

  if(running) return;
  running = true;
  btn.disabled = true;

  try{

    const gateId = getGateId();

    /* ===== REAR CAMERA ===== */
    setStatus("Opening rear camera...");
    await startCam("environment");

    await wait(2000);

    const rearSnap = capture();

    await stopCam();
    await wait(400);

    /* ===== FRONT CAMERA ===== */
    setStatus("Capturing guest face...");
    await startCam("user");

    await wait(1800);

    const frontSnap = capture();

    await stopCam();

    /* ===== SMART DATA STRUCTURE ===== */

    const data = {
      timestamp: new Date().toISOString(),
      gateId: gateId,

      rearSnapshot: rearSnap,
      frontSnapshot: frontSnap,

      action: "Guest Entry",

      /* 🧠 STEP 6 INTELLIGENCE LAYER */
      visitorType: "unknown",
      confidence: 0,
      device: "gate-device",
      status: "new"
    };

    /* ===== UI UPDATE ===== */

    setStatus("Uploading to database...");

    /* ===== FIREBASE WRITE ===== */

    await addDoc(collection(db,"logs"), data);
    await addDoc(collection(db,"alerts"), data);

    setStatus("Entry Recorded ✔");

    console.log("🧠 Smart Entry:", data);

    alert("Guest captured successfully");

  }catch(e){

    console.error("ERROR:", e);

    setStatus("Error ❌");

    await stopCam();

  }

  running = false;
  btn.disabled = false;
}

/* ================= EVENT ================= */

btn.addEventListener("click", scan);

</script>

</body>
</html>
