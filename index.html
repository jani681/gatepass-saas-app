<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>Aaryan's House - Gate Security</title>

<style>
:root{
  --bg:#0B1220;
  --card:#111A2E;
  --card2:#0F1A33;
  --text:#E5E7EB;
  --muted:#94A3B8;
  --blue:#3B82F6;
  --green:#22C55E;
  --radius:18px;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:system-ui;
}

body{
  background:var(--bg);
  color:var(--text);
  display:flex;
  justify-content:center;
}

.app{
  width:100%;
  max-width:420px;
  padding:18px;
}

/* HEADER */
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:10px;
}

.title{font-size:20px;font-weight:700;}
.subtitle{font-size:12px;color:var(--muted);}

.status-dot{
  width:10px;height:10px;
  background:var(--green);
  border-radius:50%;
  box-shadow:0 0 10px var(--green);
}

/* CARD */
.card{
  background:linear-gradient(145deg,var(--card),var(--card2));
  border-radius:var(--radius);
  padding:16px;
  margin-top:16px;
  box-shadow:0 10px 30px rgba(0,0,0,0.3);
}

/* HERO IMAGE */
.hero-img{
  width:100%;
  height:180px;
  border-radius:16px;
  object-fit:cover;
  background:#0A1020;
}

/* GATE */
.badge{
  padding:4px 10px;
  border-radius:20px;
  background:#1f2a44;
  font-size:12px;
  color:var(--muted);
}

/* BUTTON */
.button{
  width:100%;
  margin-top:16px;
  padding:16px;
  border:none;
  border-radius:14px;
  background:linear-gradient(90deg,var(--blue),#60A5FA);
  color:white;
  font-size:16px;
  font-weight:600;
}

.status{
  margin-top:10px;
  font-size:13px;
  color:var(--muted);
  text-align:center;
}

.camera-box{
  height:180px;
  border-radius:16px;
  background:#0A1020;
  margin-top:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--muted);
  border:1px solid rgba(255,255,255,0.05);
}

</style>
</head>

<body>

<div class="app">

  <!-- HEADER -->
  <div class="header">
    <div>
      <div class="title">Aaryan's House</div>
      <div class="subtitle">Gate Security System</div>
    </div>
    <div class="status-dot"></div>
  </div>

  <!-- 🏠 HERO HOUSE IMAGE CARD -->
  <div class="card">
    <div style="font-weight:600;margin-bottom:10px;">House View</div>

    <!-- 🔥 CHANGE ONLY THIS URL -->
    <img 
      class="hero-img"
      src="https://YOUR-HOUSE-IMAGE-URL-HERE.jpg"
      alt="Aaryan House"
    />
  </div>

  <!-- GATE CARD -->
  <div class="card">
    <div style="display:flex;justify-content:space-between;">
      <div>
        <div style="font-weight:600;">Active Gate</div>
        <div style="font-size:12px;color:#94A3B8;">Auto-detect ready</div>
      </div>
      <div class="badge">Gate: --</div>
    </div>
  </div>

  <!-- MAIN ACTION -->
  <div class="card">
    <button class="button">SCAN GUEST</button>
    <div class="status">System ready • waiting for scan</div>

    <div class="camera-box">
      Camera preview placeholder
    </div>
  </div>

</div>

</body>
</html>
