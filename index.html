<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GatePass - Digital Bell Portal</title>
    <style>
        body { 
            background-color: #0b0f19; color: #fff; font-family: -apple-system, sans-serif;
            margin: 0; padding: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; box-sizing: border-box;
        }
        .card { 
            background: #131a2c; padding: 32px 24px; border-radius: 24px; text-align: center; width: 100%; max-width: 420px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.5); border: 1px solid #1e293b; box-sizing: border-box;
        }
        h1 { color: #00f2fe; font-size: 24px; font-weight: 800; margin: 0 0 6px 0; }
        p { color: #9ca3af; font-size: 14px; margin: 0 0 25px 0; }
        .bell-container {
            width: 140px; height: 140px; background: rgba(0, 242, 254, 0.05); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 25px auto;
            border: 2px dashed rgba(0, 242, 254, 0.3); box-shadow: 0 0 20px rgba(0, 242, 254, 0.1);
        }
        .bell-btn { 
            background: linear-gradient(135deg, #00f2fe, #4facfe); color: #000; border: none;
            border-radius: 50%; font-size: 44px; cursor: pointer; width: 110px; height: 110px; 
            box-shadow: 0 8px 24px rgba(0, 242, 254, 0.4); display: flex; align-items: center; justify-content: center; outline: none; transition: transform 0.1s;
        }
        .bell-btn:active { transform: scale(0.95); }
        .bell-btn:disabled { background: #334155; color: #64748b; box-shadow: none; cursor: not-allowed; }
        video { display: none; } 
        #statusText { font-size: 14px; font-weight: 700; text-transform: uppercase; color: #00f2fe; margin-top: 15px; letter-spacing: 0.5px; }
        .warning-note { font-size: 11px; color: #ef4444; margin-top: 25px; background: rgba(239, 68, 68, 0.05); padding: 12px; border-radius: 12px; border: 1px solid rgba(239, 68, 68, 0.15); }
    </style>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>
<body>
    <div class="card">
        <h1 id="buildingTitle">Connecting...</h1>
        <p id="gateSubTitle">Securing gate console sync</p>
        <video id="video" autoplay playsinline></video>
        <div class="bell-container">
            <button class="bell-btn" id="bellBtn" onclick="triggerSnapshotRing()" disabled>🔔</button>
        </div>
        <div id="statusText">INITIALIZING...</div>
        <p class="warning-note">Note: Bell bajate hi aapki aik tasveer (Snapshot) ghar walon ko bheji jayegi.</p>
    </div>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBuYYn6V3jqUs47fnVfW1OlCywfyDX6ix0",
            authDomain: "gatepass-saas.firebaseapp.com",
            projectId: "gatepass-saas",
            storageBucket: "gatepass-saas.firebasestorage.app",
            messagingSenderId: "788886920648",
            appId: "1:788886920648:web:acf750800bf8a5b0b4f4fd"
        };
        firebase.initializeApp(firebaseConfig); const db = firebase.firestore();
        const urlParams = new URLSearchParams(window.location.search);
        let accountId = urlParams.get('id'); let gateName = urlParams.get('gate') || "Main Gate";

        if (!accountId) {
            document.getElementById("buildingTitle").innerText = "Welcome to Iqbal House 🏠";
            document.getElementById("gateSubTitle").innerText = "Adhi Kot, Khushab";
            activateConsole("RING BELL");
        } else {
            db.collection("users").doc(accountId).get().then((doc) => {
                if (doc.exists) {
                    document.getElementById("buildingTitle").innerText = `Welcome to ${doc.data().buildingName} 🏠`;
                    document.getElementById("gateSubTitle").innerText = `${doc.data().city} (${gateName})`;
                    activateConsole("RING BELL");
                } else {
                    document.getElementById("buildingTitle").innerText = "Terminal Error ❌";
                    document.getElementById("statusText").innerText = "MISMATCH LINK";
                }
            });
        }

        function activateConsole(msg) {
            document.getElementById("bellBtn").disabled = false;
            document.getElementById("statusText").innerText = msg;
        }

        const video = document.getElementById('video');
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false })
            .then(stream => { video.srcObject = stream; }).catch(() => console.log("Camera handling initialized."));

        function triggerSnapshotRing() {
            const btn = document.getElementById('bellBtn'); const txt = document.getElementById('statusText');
            btn.disabled = true; txt.innerText = "SENDING ALERT...";
            
            const canvas = document.createElement('canvas'); canvas.width = 480; canvas.height = 360;
            canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
            const snapshotUrl = canvas.toDataURL('image/jpeg', 0.7);

            db.collection("logs").add({
                accountId: accountId || "DEFAULT_PREVIOUS_PRESET", gate: gateName, status: "ringing", snapshot: snapshotUrl, timestamp: new Date().toLocaleString()
            }).then(() => {
                txt.style.color = "#00e676"; txt.innerText = "Bell Sent Successfully!";
            }).catch(() => { txt.innerText = "RETRY"; btn.disabled = false; });
        }
    </script>
</body>
</html>
