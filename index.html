<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Gate Terminal</title>
    <style>
        :root { --bg: #050505; --accent: #00f2fe; --text: #ffffff; }
        body { background-color: var(--bg); color: var(--text); font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .terminal { text-align: center; width: 90%; max-width: 400px; padding: 2rem; background: #111; border-radius: 20px; }
        .ring-btn { width: 120px; height: 120px; border-radius: 50%; background: var(--accent); border: none; cursor: pointer; font-size: 1.5rem; font-weight: bold; color: #000; }
        .error { color: #ff4d4d; font-weight: bold; margin-bottom: 1rem; }
    </style>
</head>
<body>
    <div class="terminal" id="app">
        <h2 id="gateTitle">Loading...</h2>
        <p id="statusLabel">Checking configuration...</p>
        <button class="ring-btn" id="ringBell">RING</button>
    </div>

    <script type="module">
        import { db } from './firebase-config.js';
        import { collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        // URL Parameters Extraction
        const urlParams = new URLSearchParams(window.location.search);
        const accountId = urlParams.get('id');
        const gateName = urlParams.get('gate');

        const appDiv = document.getElementById('app');

        if (!accountId || !gateName) {
            appDiv.innerHTML = `<h1 class='error'>Routing Error</h1><p>Missing Gate Configuration.</p><p style="font-size:0.8rem; color:#666;">Please use a valid link from Admin Dashboard.</p>`;
        } else {
            document.getElementById('gateTitle').innerText = decodeURIComponent(gateName);
            document.getElementById('statusLabel').innerText = "System Ready";

            document.getElementById('ringBell').addEventListener('click', async () => {
                const btn = document.getElementById('ringBell');
                btn.disabled = true;
                document.getElementById('statusLabel').innerText = "Sending signal...";
                
                try {
                    await addDoc(collection(db, "logs"), {
                        accountId: accountId,
                        gateName: decodeURIComponent(gateName),
                        timestamp: new Date().toISOString(),
                        status: "pending"
                    });
                    document.getElementById('statusLabel').innerText = "Notification Sent!";
                    setTimeout(() => {
                        document.getElementById('statusLabel').innerText = "System Ready";
                        btn.disabled = false;
                    }, 3000);
                } catch (e) {
                    document.getElementById('statusLabel').innerText = "Connection Failed!";
                    btn.disabled = false;
                }
            });
        }
    </script>
</body>
</html>
