<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>Aaryan's House - Gate Security</title>

<style>
:root{
  --bg:#0B1220;
  --card:#111A2E;
  --card2:#0F1A33;
  --text:#E5E7EB;
  --muted:#94A3B8;
  --blue:#3B82F6;
  --green:#22C55E;
  --radius:18px;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:system-ui;
}

body{
  background:var(--bg);
  color:var(--text);
  display:flex;
  justify-content:center;
}

.app{
  width:100%;
  max-width:420px;
  padding:18px;
}

/* HEADER */
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:10px;
}

.title{font-size:20px;font-weight:700;}
.subtitle{font-size:12px;color:var(--muted);}

.status-dot{
  width:10px;height:10px;
  background:var(--green);
  border-radius:50%;
  box-shadow:0 0 10px var(--green);
}

/* CARD */
.card{
  background:linear-gradient(145deg,var(--card),var(--card2));
  border-radius:var(--radius);
  padding:16px;
  margin-top:16px;
  box-shadow:0 10px 30px rgba(0,0,0,0.3);
}

/* GATE */
.badge{
  padding:4px 10px;
  border-radius:20px;
  background:#1f2a44;
  font-size:12px;
  color:var(--muted);
}

/* BUTTON */
.button{
  width:100%;
  margin-top:16px;
  padding:16px;
  border:none;
  border-radius:14px;
  background:linear-gradient(90deg,var(--blue),#60A5FA);
  color:white;
  font-size:16px;
  font-weight:600;
  cursor:pointer;
}

.button:disabled{
  opacity:0.6;
}

/* STATUS */
.status{
  margin-top:10px;
  font-size:13px;
  color:var(--muted);
  text-align:center;
}

/* CAMERA BOX */
.camera-box{
  height:180px;
  border-radius:16px;
  background:#0A1020;
  margin-top:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--muted);
  border:1px solid rgba(255,255,255,0.05);
  overflow:hidden;
}

video{
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:16px;
}
</style>
</head>

<body>

<div class="app">

  <!-- HEADER -->
  <div class="header">
    <div>
      <div class="title">Aaryan's House</div>
      <div class="subtitle">Gate Security System</div>
    </div>
    <div class="status-dot"></div>
  </div>

  <!-- GATE INFO -->
  <div class="card">
    <div style="display:flex;justify-content:space-between;">
      <div>
        <div style="font-weight:600;">Active Gate</div>
        <div style="font-size:12px;color:#94A3B8;">Detected via QR</div>
      </div>
      <div class="badge" id="gateBadge">Gate: --</div>
    </div>
  </div>

  <!-- MAIN CONTROL -->
  <div class="card">
    <button class="button" id="scanBtn">SCAN GUEST</button>
    <div class="status" id="status">System ready</div>

    <div class="camera-box" id="cameraBox">
      Camera preview placeholder
    </div>
  </div>

</div>

<script>
/* ================= CORE STATE ================= */

let stream = null;
let running = false;

const statusEl = document.getElementById("status");
const scanBtn = document.getElementById("scanBtn");
const cameraBox = document.getElementById("cameraBox");
const gateBadge = document.getElementById("gateBadge");

/* ================= GATE DETECTION ================= */

function getGateId() {
  const params = new URLSearchParams(window.location.search);
  const gate = params.get("gate");

  if (gate === "1") return "Gate 1";
  if (gate === "2") return "Gate 2";

  return "Unknown Gate";
}

const gateId = getGateId();
gateBadge.innerText = gateId;
statusEl.innerText = "System ready • " + gateId;

/* ================= UTIL ================= */

function wait(ms){
  return new Promise(r => setTimeout(r, ms));
}

function setStatus(t){
  statusEl.innerText = t;
}

/* ================= CAMERA ================= */

async function stopCamera(){
  if(stream){
    stream.getTracks().forEach(t => t.stop());
  }
  stream = null;
  cameraBox.innerHTML = "Camera stopped";
}

async function startCamera(mode){
  await stopCamera();

  stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: { ideal: mode } },
    audio: false
  });

  const video = document.createElement("video");
  video.autoplay = true;
  video.playsInline = true;
  video.srcObject = stream;

  cameraBox.innerHTML = "";
  cameraBox.appendChild(video);

  await video.play();
  await wait(200);

  return video;
}

function capture(video){
  const canvas = document.createElement("canvas");
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;

  const ctx = canvas.getContext("2d");
  ctx.drawImage(video,0,0);

  return canvas.toDataURL("image/jpeg",0.85);
}

/* ================= SCAN FLOW ================= */

async function scanGuest(){

  if(running) return;
  running = true;
  scanBtn.disabled = true;

  try{

    /* STEP 1: REAR CAMERA */
    setStatus("Opening rear camera...");
    const rearVideo = await startCamera("environment");
    await wait(2000);
    const rearSnapshot = capture(rearVideo);

    /* STEP 2: STOP REAR */
    await stopCamera();
    await wait(300);

    /* STEP 3: FRONT CAMERA */
    setStatus("Capturing guest face...");
    const frontVideo = await startCamera("user");
    await wait(1800);
    const frontSnapshot = capture(frontVideo);

    await stopCamera();

    /* STEP 4: FINAL */
    setStatus("Scan Completed ✔");

    const visitor = {
      gateId,
      time: new Date().toISOString(),
      rearSnapshot,
      frontSnapshot,
      action: "Guest Entry"
    };

    console.log("VISITOR:", visitor);

    cameraBox.innerHTML = `
      <div style="color:#22c55e;text-align:center;padding:20px;">
        ✔ Scan Completed<br/>
        <small>${gateId}</small>
      </div>
    `;

  }catch(err){
    console.error(err);
    setStatus("Error occurred ❌");
  }

  running = false;
  scanBtn.disabled = false;
}

/* ================= EVENTS ================= */

scanBtn.addEventListener("click", scanGuest);

</script>

</body>
</html>
