<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aaryan's Security</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f9; padding: 20px; text-align: center; }
        .card { background: white; padding: 20px; border-radius: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .btn { width: 100%; padding: 20px; border-radius: 15px; border: none; background: #6366f1; color: white; font-weight: bold; margin-bottom: 10px; cursor: pointer; }
        #video { width: 100%; border-radius: 15px; display: none; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Aaryan's House</h1>
        <button class="btn" onclick="askPermission()">ENABLE NOTIFICATIONS</button>
        <button class="btn" onclick="triggerTestNotification()">TEST NOTIFICATION</button>
    </div>

    <script>
        // 1. Permission lene ke liye
        async function askPermission() {
            const permission = await Notification.requestPermission();
            if (permission === "granted") {
                alert("Notifications enabled!");
            } else {
                alert("Permission denied!");
            }
        }

        // 2. Notification trigger karne ke liye
        async function triggerTestNotification() {
            if (Notification.permission === "granted") {
                const registration = await navigator.serviceWorker.getRegistration();
                if (registration) {
                    registration.showNotification("Gate Alert!", {
                        body: "Naya guest entry hua hai!",
                        icon: "https://cdn-icons-png.flaticon.com/512/2991/2991148.png"
                    });
                } else {
                    // Agar service worker na mile, toh basic notification
                    new Notification("Gate Alert!", {
                        body: "Naya guest entry hua hai!",
                        icon: "https://cdn-icons-png.flaticon.com/512/2991/2991148.png"
                    });
                }
            } else {
                alert("Pehle notifications enable karein!");
            }
        }

        // Service Worker Register karne ke liye
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('firebase-messaging-sw.js')
            .then(() => console.log('Service Worker Registered'));
        }
    </script>
</body>
</html>
