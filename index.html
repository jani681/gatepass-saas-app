<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart Gate Terminal</title>
    <style>
        :root {
            --bg: #050505;
            --card: #111111;
            --accent: #00f2fe;
            --text: #ffffff;
            --border: #222222;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .terminal {
            width: 90%;
            max-width: 450px;
            text-align: center;
            background: var(--card);
            padding: 2rem;
            border-radius: 20px;
            border: 1px solid var(--border);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        /* Camera Placeholder */
        .camera-frame {
            width: 100%;
            height: 220px;
            background: #000;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid var(--border);
            color: #333;
        }

        /* Status & Text */
        h1 { margin: 0 0 0.5rem 0; font-size: 1.5rem; }
        .status { color: var(--accent); font-size: 0.9rem; margin-bottom: 2rem; }

        /* Ring Button */
        .ring-btn {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: var(--accent);
            color: var(--bg);
            border: none;
            font-size: 2rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.3);
        }
        .ring-btn:active { transform: scale(0.95); }

        /* Snapshot Preview */
        .snapshot-preview {
            margin-top: 2rem;
            height: 60px;
            width: 100px;
            background: #1a1a1a;
            border-radius: 4px;
            display: inline-block;
            border: 1px solid var(--border);
        }

        /* Responsive scaling */
        @media (max-height: 600px) {
            .terminal { padding: 1rem; }
            .camera-frame { height: 150px; }
        }
    </style>
</head>
<body>

    <div class="terminal">
        <div class="camera-frame" id="videoPlaceholder">
            [ Camera Preview ]
        </div>

        <h1>Visitor Access</h1>
        <div class="status" id="statusLabel">Ready to connect...</div>

        <button class="ring-btn" id="ringBell">RING</button>

        <div style="margin-top: 1rem;">
            <div class="snapshot-preview" id="snapPreview"></div>
        </div>
    </div>

    <script>
        // Placeholder for future camera and doorbell logic
        document.getElementById('ringBell').addEventListener('click', () => {
            document.getElementById('statusLabel').innerText = "Sending signal...";
            console.log("Doorbell ring triggered.");
        });
    </script>
</body>
</html>
