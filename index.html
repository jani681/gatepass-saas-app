<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Gate Device - Aaryan House</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:system-ui;
}

body{
  background:#0B1220;
  color:white;
  display:flex;
  justify-content:center;
}

.app{
  width:100%;
  max-width:420px;
  padding:16px;
}

.card{
  background:#111A2E;
  border-radius:18px;
  padding:16px;
  margin-top:20px;
  box-shadow:0 10px 25px rgba(0,0,0,0.35);
}

h2{
  font-size:24px;
}

.sub{
  color:#94A3B8;
  margin-top:4px;
  font-size:13px;
}

video{
  width:100%;
  border-radius:14px;
  background:black;
  margin-top:10px;
  aspect-ratio: 3/4;
  object-fit:cover;
}

button{
  width:100%;
  margin-top:14px;
  padding:16px;
  border:none;
  border-radius:14px;
  background:#3B82F6;
  color:white;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

button:disabled{
  opacity:0.7;
}

.status{
  margin-top:14px;
  text-align:center;
  font-size:13px;
  color:#94A3B8;
  min-height:20px;
}

.gate-badge{
  margin-top:12px;
  display:inline-block;
  padding:6px 12px;
  background:#1E293B;
  border-radius:999px;
  font-size:12px;
  color:#93C5FD;
}

</style>
</head>

<body>

<div class="app">

  <h2>🚪 Gate Scanner</h2>

  <div class="sub">
    Aaryan's House Security System
  </div>

  <div class="gate-badge" id="gateLabel">
    Detecting Gate...
  </div>

  <div class="card">

    <video id="video" autoplay playsinline muted></video>

    <canvas id="canvas" style="display:none;"></canvas>

    <button id="scanBtn">
      Scan Guest
    </button>

    <div class="status" id="status">
      Ready
    </div>

  </div>

</div>

<script type="module">

/* ================= FIREBASE ================= */

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

import {
  getFirestore,
  collection,
  addDoc,
  serverTimestamp
}
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

/* ================= CONFIG ================= */

const firebaseConfig = {
  apiKey: "AIzaSyBuYYn6V3jqUs47fnVfW1OlCywfyDX6ix0",
  authDomain: "gatepass-saas.firebaseapp.com",
  projectId: "gatepass-saas",
  storageBucket: "gatepass-saas.appspot.com",
  messagingSenderId: "788886920648",
  appId: "1:788886920648:web:acf750800bf8a5b0b4f4fd"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* ================= UI ================= */

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const btn = document.getElementById("scanBtn");
const status = document.getElementById("status");
const gateLabel = document.getElementById("gateLabel");

/* ================= STATE ================= */

let stream = null;
let running = false;

/* ================= HELPERS ================= */

const wait = (ms) => new Promise(r => setTimeout(r, ms));

function setStatus(text){
  status.innerText = text;
}

/* ================= GATE DETECTION ================= */

function getGateId(){

  const gate = new URLSearchParams(location.search).get("gate");

  if(gate === "1") return "Gate 1";
  if(gate === "2") return "Gate 2";

  return "Unknown Gate";
}

const CURRENT_GATE = getGateId();

gateLabel.innerText = CURRENT_GATE;

/* ================= CAMERA ================= */

async function stopCam(){

  if(stream){
    stream.getTracks().forEach(track => track.stop());
  }

  stream = null;

  video.pause();
  video.srcObject = null;

  await wait(300);
}

async function startCam(mode){

  await stopCam();

  stream = await navigator.mediaDevices.getUserMedia({
    video:{
      facingMode:{
        ideal: mode
      },
      width:{ ideal: 480 },
      height:{ ideal: 640 }
    },
    audio:false
  });

  video.srcObject = stream;

  await video.play();

  await wait(300);
}

/* ================= ULTRA SAFE IMAGE CAPTURE ================= */

function capture(){

  const ctx = canvas.getContext("2d");

  const width = 240;
  const height = 320;

  canvas.width = width;
  canvas.height = height;

  ctx.drawImage(video, 0, 0, width, height);

  /* SUPER compressed for Firestore safety */
  return canvas.toDataURL("image/jpeg", 0.25);
}

/* ================= MAIN ENGINE ================= */

async function scan(){

  if(running) return;

  running = true;
  btn.disabled = true;

  try{

    /* ===== REAR CAMERA ===== */

    setStatus("Opening rear camera...");

    await startCam("environment");

    await wait(2000);

    const rearSnapshot = capture();

    await stopCam();

    await wait(500);

    /* ===== FRONT CAMERA ===== */

    setStatus("Capturing guest face...");

    await startCam("user");

    await wait(1800);

    const frontSnapshot = capture();

    await stopCam();

    /* ===== SAFE PAYLOAD ===== */

    const data = {

      timestamp: serverTimestamp(),

      gateId: CURRENT_GATE,

      rearSnapshot: rearSnapshot.substring(0, 150000),

      frontSnapshot: frontSnapshot.substring(0, 150000),

      action: "Guest Entry",

      visitorType: "unknown",

      confidence: 0,

      status: "new",

      device: "gate-device"

    };

    console.log("Payload Size:",
      JSON.stringify(data).length
    );

    /* ===== DATABASE ===== */

    setStatus("Uploading to database...");

    await addDoc(collection(db, "logs"), data);

    await addDoc(collection(db, "alerts"), data);

    /* ===== SUCCESS ===== */

    setStatus("Entry Recorded ✔");

    alert("Guest captured successfully");

  }catch(err){

    console.error("FULL ERROR:", err);

    setStatus("Error uploading data ❌");

    alert("Upload failed: " + err.message);

    await stopCam();
  }

  running = false;
  btn.disabled = false;
}

/* ================= EVENT ================= */

btn.addEventListener("click", scan);

</script>

</body>
</html>
