<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GatePass - Guest Portal</title>
    <style>
        body { 
            background-color: #121212; 
            color: #ffffff; 
            font-family: 'Segoe UI', sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
        }
        .card { 
            background-color: #1e1e1e; 
            padding: 30px; 
            border-radius: 15px; 
            text-align: center; 
            width: 85%; 
            max-width: 400px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); 
        }
        h1 { color: #00adb5; font-size: 24px; margin-bottom: 5px; }
        p { color: #aaaaaa; font-size: 14px; margin-top: 0; }
        .bell-btn { 
            background: linear-gradient(135deg, #00adb5, #007bb5); 
            color: white; 
            border: none; 
            padding: 20px; 
            border-radius: 50%; 
            font-size: 40px; 
            cursor: pointer; 
            width: 100px; 
            height: 100px; 
            margin: 20px 0; 
            box-shadow: 0 0 20px rgba(0, 173, 181, 0.4); 
            transition: transform 0.2s;
        }
        .bell-btn:active { transform: scale(0.95); }
        .bell-btn:disabled { background: #555555; box-shadow: none; cursor: not-allowed; }
        video { display: none; } 
        .note { font-size: 11px; color: #ff4a4a; margin-top: 15px; }
    </style>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>
<body>

    <div class="card">
        <h1 id="buildingTitle">Loading Portal... 🏠</h1>
        <p id="gateSubTitle">Detecting Gate...</p>
        
        <video id="video" autoplay playsinline></video>

        <button class="bell-btn" id="bellBtn" onclick="takeSnapshotAndRing()" disabled>🔔</button>
        <p id="statusText" style="color: #ffffff; font-weight: bold; margin-top: 10px;">WAITING...</p>

        <p class="note">Note: Bell bajate hi aapki aik tasveer (Snapshot) ghar walon ko bheji jayegi.</p>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBuYYn6V3jqUs47fnVfW1OlCywfyDX6ix0",
            authDomain: "gatepass-saas.firebaseapp.com",
            projectId: "gatepass-saas",
            storageBucket: "gatepass-saas.firebasestorage.app",
            messagingSenderId: "788886920648",
            appId: "1:788886920648:web:acf750800bf8a5b0b4f4fd"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // 🧠 URL Se Parameters (SaaS ID aur Gate Name) Nikalna
        const urlParams = new URLSearchParams(window.location.search);
        let saasAccountId = urlParams.get('id');
        let currentGateName = urlParams.get('gate') || "Main Gate";

        // Fallback: Agar koi direct open kare bina link ke, to default Iqbal House set ho jaye
        if (!saasAccountId) {
            saasAccountId = "DEFAULT_PREVIOUS_PRESET"; // Hum back-end handle kar rahe hain
            document.getElementById("buildingTitle").innerText = "Welcome to Iqbal House 🏠";
            document.getElementById("gateSubTitle").innerText = "Adhi Kot, Khushab (Gate 1)";
            document.getElementById("bellBtn").disabled = false;
            document.getElementById("statusText").innerText = "RING BELL";
        } else {
            // Firebase se is specific SaaS ID ka data uthana
            db.collection("users").doc(saasAccountId).get().then((doc) => {
                if (doc.exists) {
                    const data = doc.data();
                    document.getElementById("buildingTitle").innerText = `Welcome to ${data.buildingName || "Our House"} 🏠`;
                    document.getElementById("gateSubTitle").innerText = `${data.city || ""} (${currentGateName})`;
                    document.getElementById("bellBtn").disabled = false;
                    document.getElementById("statusText").innerText = "RING BELL";
                } else {
                    document.getElementById("buildingTitle").innerText = "Invalid SaaS Account ❌";
                    document.getElementById("statusText").innerText = "Access Denied";
                }
            }).catch(err => {
                console.error("SaaS Fetch Error:", err);
            });
        }

        // Camera setup
        const video = document.getElementById('video');
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false })
            .then(stream => { video.srcObject = stream; })
            .catch(err => { console.log("Camera error"); });

        function takeSnapshotAndRing() {
            const btn = document.getElementById('bellBtn');
            const status = document.getElementById('statusText');
            
            btn.disabled = true;
            status.innerText = "Sending Alert...";

            const canvas = document.createElement('canvas');
            canvas.width = 320;
            canvas.height = 240;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const imageDataUrl = canvas.toDataURL('image/jpeg');

            // Dynamic ID aur Dynamic Gate ke sath log save karna
            db.collection("logs").add({
                accountId: saasAccountId, 
                gate: currentGateName,
                status: "ringing",
                snapshot: imageDataUrl, 
                timestamp: new Date().toLocaleString()
            })
            .then(() => {
                status.style.color = "#00adb5";
                status.innerText = "Bell Sent Successfully!";
                alert("Ghar walon ko bell bhej di gayi hai!");
            })
            .catch((error) => {
                status.style.color = "#ff4a4a";
                status.innerText = "Failed";
                btn.disabled = false;
            });
        }
    </script>
</body>
</html>
