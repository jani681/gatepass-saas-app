<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Gate Security System</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0f172a;
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: #1e293b;
      border-radius: 18px;
      padding: 25px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }

    h1 { font-size: 24px; margin-bottom: 10px; }
    p { color: #cbd5e1; font-size: 14px; margin-bottom: 20px; }

    #video {
      width: 100%;
      border-radius: 14px;
      background: black;
      display: none;
      margin-bottom: 15px;
      object-fit: cover;
    }

    canvas { display: none; }

    .status {
      margin: 15px 0;
      font-size: 14px;
      color: #93c5fd;
      min-height: 20px;
    }

    button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }

    button:disabled { background: #475569; }

    .success { color: #4ade80; }
    .error { color: #f87171; }
  </style>
</head>

<body>

<div class="container">
  <h1>Gate Security System</h1>
  <p>Aaryan's House</p>

  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>

  <div class="status" id="status">Ready</div>

  <button id="scanBtn">Scan Guest</button>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBuYYn6V3jqUs47fnVFw1OlCywfyDX6ix0",
  authDomain: "gatepass-saas.firebaseapp.com",
  projectId: "gatepass-saas",
  storageBucket: "gatepass-saas.appspot.com",
  messagingSenderId: "788886920648",
  appId: "1:788886920648:web:acf750800bf8a5b0b4f4fd"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const status = document.getElementById("status");
const btn = document.getElementById("scanBtn");

let stream = null;
let running = false;

function setStatus(t) {
  status.textContent = t;
}

function wait(ms) {
  return new Promise(r => setTimeout(r, ms));
}

/* ================= SAFE CAMERA ================= */

async function stopCamera() {
  if (stream) {
    stream.getTracks().forEach(t => t.stop());
  }
  stream = null;
  video.srcObject = null;
  video.pause();
  video.style.display = "none";
  await wait(200);
}

async function startCamera(mode) {
  await stopCamera();

  const s = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: { ideal: mode } },
    audio: false
  });

  stream = s;
  video.srcObject = s;
  video.style.display = "block";
  await video.play();
  await wait(200);
}

function capture() {
  const ctx = canvas.getContext("2d");
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  ctx.drawImage(video, 0, 0);
  return canvas.toDataURL("image/jpeg", 0.85);
}

/* ================= SAFE VISITOR HASH (NON-BLOCKING) ================= */

function generateFaceHash(dataUrl) {
  let hash = 0;
  for (let i = 0; i < dataUrl.length; i++) {
    hash = (hash << 5) - hash + dataUrl.charCodeAt(i);
    hash |= 0;
  }
  return hash.toString();
}

/* ================= MAIN FLOW ================= */

async function run() {
  if (running) return;
  running = true;
  btn.disabled = true;

  let rearSnapshot = "";
  let frontSnapshot = "";

  try {

    setStatus("Opening rear camera...");
    await startCamera("environment");
    await wait(2000);
    rearSnapshot = capture();
    await stopCamera();

    await wait(500);

    setStatus("Capturing guest face...");
    await startCamera("user");
    await wait(1800);
    frontSnapshot = capture();
    await stopCamera();

    setStatus("Uploading to database...");

    // 🔥 FIX: NO blocking Firestore read anymore
    const faceHash = generateFaceHash(frontSnapshot);

    await addDoc(collection(db, "logs"), {
      timestamp: new Date(),
      rearSnapshot,
      frontSnapshot,
      action: "Guest Entry",
      faceHash,
      visitorType: "processing"
    });

    setStatus("Done", "success");

  } catch (e) {
    console.error(e);
    setStatus("Error", "error");
    await stopCamera();
  }

  running = false;
  btn.disabled = false;
}

btn.addEventListener("click", run);

</script>

</body>
</html>
