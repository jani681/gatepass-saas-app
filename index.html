<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>Aaryan's House - Gate Security</title>

<style>
:root{
  --bg:#0B1220;
  --card:#111A2E;
  --card2:#0F1A33;
  --text:#E5E7EB;
  --muted:#94A3B8;
  --blue:#3B82F6;
  --green:#22C55E;
  --radius:18px;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:system-ui;
}

body{
  background:var(--bg);
  color:var(--text);
  display:flex;
  justify-content:center;
}

.app{
  width:100%;
  max-width:420px;
  padding:18px;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:10px;
}

.title{font-size:20px;font-weight:700;}
.subtitle{font-size:12px;color:var(--muted);}

.status-dot{
  width:10px;height:10px;
  background:var(--green);
  border-radius:50%;
  box-shadow:0 0 10px var(--green);
}

.card{
  background:linear-gradient(145deg,var(--card),var(--card2));
  border-radius:var(--radius);
  padding:16px;
  margin-top:16px;
  box-shadow:0 10px 30px rgba(0,0,0,0.3);
}

.button{
  width:100%;
  margin-top:16px;
  padding:16px;
  border:none;
  border-radius:14px;
  background:linear-gradient(90deg,var(--blue),#60A5FA);
  color:white;
  font-size:16px;
  font-weight:600;
}

.button:disabled{
  opacity:0.6;
}

.status{
  margin-top:10px;
  font-size:13px;
  color:var(--muted);
  text-align:center;
}

.camera-box{
  height:180px;
  border-radius:16px;
  background:#0A1020;
  margin-top:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--muted);
  overflow:hidden;
}

video{
  width:100%;
  height:100%;
  object-fit:cover;
}
</style>
</head>

<body>

<div class="app">

  <div class="header">
    <div>
      <div class="title">Aaryan's House</div>
      <div class="subtitle">Gate Security System</div>
    </div>
    <div class="status-dot"></div>
  </div>

  <div class="card">
    <button class="button" id="scanBtn">SCAN GUEST</button>
    <div class="status" id="status">System ready</div>
    <div class="camera-box" id="cameraBox">Camera preview</div>
  </div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

/* ================= FIREBASE ================= */

const firebaseConfig = {
  apiKey: "AIzaSyBuYYn6V3jqUs47fnVFvW1OlCywfyDX6ix0",
  authDomain: "gatepass-saas.firebaseapp.com",
  projectId: "gatepass-saas",
  storageBucket: "gatepass-saas.appspot.com",
  messagingSenderId: "788886920648",
  appId: "1:788886920648:web:acf750800bf8a5b0b4f4fd"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* ================= UI ================= */

const statusEl = document.getElementById("status");
const btn = document.getElementById("scanBtn");
const box = document.getElementById("cameraBox");

/* ================= STATE ================= */

let stream = null;
let running = false;

/* ================= HELPERS ================= */

const wait = (ms) => new Promise(r => setTimeout(r, ms));

function setStatus(t){
  statusEl.textContent = t;
}

/* ================= GATE ================= */

function getGateId(){
  const g = new URLSearchParams(location.search).get("gate");
  if(g === "1") return "Gate 1";
  if(g === "2") return "Gate 2";
  return "Unknown Gate";
}

const gateId = getGateId();

/* ================= CAMERA ================= */

async function stopCamera(){
  try{
    if(stream){
      stream.getTracks().forEach(t => t.stop());
    }
  }catch(e){}
  stream = null;
  box.innerHTML = "Camera stopped";
}

async function startCamera(mode){
  await stopCamera();

  stream = await navigator.mediaDevices.getUserMedia({
    video:{ facingMode:{ ideal: mode } },
    audio:false
  });

  const video = document.createElement("video");
  video.autoplay = true;
  video.playsInline = true;
  video.srcObject = stream;

  box.innerHTML = "";
  box.appendChild(video);

  await video.play();
  await wait(200);

  return video;
}

function capture(video){
  const c = document.createElement("canvas");
  c.width = video.videoWidth;
  c.height = video.videoHeight;
  c.getContext("2d").drawImage(video,0,0);
  return c.toDataURL("image/jpeg",0.85);
}

/* ================= SAFE FIREBASE ================= */

async function safeWrite(path,data){
  try{
    await addDoc(collection(db,path),data);
    console.log("✔ saved:", path);
  }catch(err){
    console.warn("⚠ firebase skipped:", err.message);
  }
}

/* ================= MAIN FLOW ================= */

async function scan(){

  if(running) return;
  running = true;
  btn.disabled = true;

  try{

    setStatus("Opening rear camera...");
    const rear = await startCamera("environment");
    await wait(2000);
    const rearSnap = capture(rear);

    await stopCamera();
    await wait(300);

    setStatus("Capturing face...");
    const front = await startCamera("user");
    await wait(1800);
    const frontSnap = capture(front);

    await stopCamera();

    const data = {
      gateId,
      timestamp: new Date().toISOString(),
      rearSnapshot: rearSnap,
      frontSnapshot: frontSnap,
      action: "Guest Entry"
    };

    setStatus("Processing...");

    /* FIREBASE SAFE (NON-BLOCKING) */
    safeWrite("logs", data);
    safeWrite("alerts", {...data, status:"new"});

    setStatus("Done ✔");

    box.innerHTML = `
      <div style="color:#22c55e;text-align:center;padding:20px;">
        ✔ Scan Completed<br/>
        <small>${gateId}</small>
      </div>
    `;

  }catch(e){
    console.error(e);
    setStatus("Error ❌");
  }

  running = false;
  btn.disabled = false;
}

btn.addEventListener("click",scan);

</script>

</body>
</html>
