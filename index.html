<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GatePass Terminal - Ring Bell</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131a2c;
            --primary: #00f2fe;
            --primary-glow: rgba(0, 242, 254, 0.3);
            --success: #00e676;
            --text-main: #ffffff;
            --text-muted: #7e8b9b;
            --border-color: #1e293b;
        }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body {
            background-color: var(--bg-color); color: var(--text-main);
            margin: 0; padding: 20px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }
        .terminal-container {
            background-color: var(--card-bg); border: 1px solid var(--border-color);
            padding: 30px 24px; border-radius: 24px; width: 100%; max-width: 420px;
            text-align: center; box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
        }
        .tenant-title { font-size: 24px; font-weight: 800; margin: 0 0 6px 0; color: #fff; }
        .tenant-meta { font-size: 14px; color: var(--text-muted); margin: 0 0 25px 0; font-weight: 500; }
        
        /* Camera Frame Container */
        .camera-box {
            width: 100%; max-width: 280px; height: 210px; background: #000;
            margin: 0 auto 25px auto; border-radius: 18px; overflow: hidden;
            border: 2px solid var(--border-color); position: relative;
        }
        video, canvas { width: 100%; height: 100%; object-fit: cover; }
        canvas { display: none; }

        /* Modern Pulse Bell Button */
        .bell-trigger-wrapper { position: relative; width: 120px; height: 120px; margin: 0 auto 20px auto; }
        .bell-btn {
            width: 100%; height: 100%; border-radius: 50%;
            background: linear-gradient(135deg, #00bac7, #00f2fe);
            border: none; cursor: pointer; display: flex; align-items: center;
            justify-content: center; font-size: 48px; position: relative; z-index: 2;
            box-shadow: 0 8px 25px rgba(0, 242, 254, 0.4); transition: transform 0.1s ease;
        }
        .bell-btn:active { transform: scale(0.94); }
        
        /* Interactive Radar Ring Animation */
        .bell-trigger-wrapper::after {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            border-radius: 50%; background: var(--primary); opacity: 0.4;
            z-index: 1; animation: radarPulse 2s infinite ease-out;
        }
        @keyframes radarPulse {
            0% { transform: scale(1); opacity: 0.4; }
            100% { transform: scale(1.5); opacity: 0; }
        }

        .action-label { font-size: 15px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: #fff; margin-bottom: 8px; }
        .warning-note { font-size: 11px; color: #ef4444; background: rgba(239, 68, 68, 0.08); padding: 8px 12px; border-radius: 10px; border: 1px solid rgba(239, 68, 68, 0.15); margin-top: 15px; }
        
        /* Status Alerts */
        .status-toast { display: none; font-size: 14px; font-weight: 700; color: var(--success); margin: 15px 0; padding: 10px; background: rgba(0, 230, 118, 0.1); border-radius: 10px; border: 1px solid rgba(0, 230, 118, 0.2); }
    </style>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>
<body>

    <div class="terminal-container">
        <h2 class="tenant-title" id="displayBuilding">Loading Portal...</h2>
        <p class="tenant-meta" id="displayGate">Validating routing parameters...</p>

        <div class="camera-box">
            <video id="webcam" autoplay playsinline muted></video>
            <canvas id="snapshotCanvas"></canvas>
        </div>

        <div class="bell-trigger-wrapper">
            <button class="bell-btn" id="bellActionBtn" onclick="triggerRingingSequence()">🔔</button>
        </div>
        <div class="action-label">Ring Bell</div>
        
        <div class="status-toast" id="statusToast">🔔 BELL SENT SUCCESSFULLY!</div>
        <div class="warning-note">Note: Bell bajate hi aapki ek live tasveer (Snapshot) ghar walon ko bhei jayegi.</div>
    </div>

    <script>
        // Real-time Database Sync Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBuYYn6V3jqUs47fnVfW1OlCywfyDX6ix0",
            authDomain: "gatepass-saas.firebaseapp.com",
            projectId: "gatepass-saas",
            storageBucket: "gatepass-saas.firebasestorage.app",
            messagingSenderId: "788886920648",
            appId: "1:788886920648:web:acf750800bf8a5b0b4f4fd"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Extract Dynamic Route Payloads
        const urlParams = new URLSearchParams(window.location.search);
        const accountId = urlParams.get('id');
        const gateLabel = urlParams.get('gate') || 'Main Gate';

        const video = document.getElementById('webcam');
        const canvas = document.getElementById('snapshotCanvas');
        const toast = document.getElementById('statusToast');

        // Initial setup: Fetch metadata & verify stream
        function initTerminal() {
            if (!accountId) {
                document.getElementById('displayBuilding').innerText = "Routing Error ❌";
                document.getElementById('displayGate').innerText = "Invalid missing 'id' pointer parameter.";
                return;
            }

            // Fetch owner profile data
            db.collection("users").doc(accountId).get().then(doc => {
                if (doc.exists) {
                    const data = doc.data();
                    document.getElementById('displayBuilding').innerText = `Welcome to ${data.buildingName} 🏠`;
                    document.getElementById('displayGate').innerText = `${data.city || ''} (${gateLabel})`;
                } else {
                    document.getElementById('displayBuilding').innerText = "Unknown Account";
                }
            }).catch(err => console.error("Metadata resolution error:", err));

            // Activate Video stream capturing node
            navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false })
                .then(stream => { video.srcObject = stream; })
                .catch(err => {
                    console.warn("Camera streaming blocked or unassigned:", err);
                    alert("Camera Access Request: Please permit camera hardware triggers for identity processing.");
                });
        }

        // Logic Core: Trigger Snapshots and Firestore Logs
        function triggerRingingSequence() {
            let base64Image = "";

            try {
                // Capture current video index frame
                const context = canvas.getContext('2d');
                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;
                context.drawImage(video, 0, 0, canvas.width, canvas.height);
                base64Image = canvas.toDataURL('image/jpeg', 0.7);
            } catch (e) {
                console.warn("Snapshot capturing failed, sending log fallback.");
            }

            // Write logs tree node payload
            db.collection("logs").add({
                accountId: accountId,
                gateName: gateLabel,
                snapshot: base64Image, // Encoded Base64 string payload
                timestamp: new Date().toISOString(),
                status: "ringing"
            })
            .then(() => {
                toast.style.display = "block";
                setTimeout(() => { toast.style.display = "none"; }, 4000);
            })
            .catch(err => alert("Transmission Error: " + err.message));
        }

        window.onload = initTerminal;
    </script>
</body>
</html>
