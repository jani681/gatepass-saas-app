<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  />

  <title>Aaryan's House - Gate Security</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0f172a;
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: #1e293b;
      border-radius: 18px;
      padding: 25px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      text-align: center;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 10px;
    }

    p {
      color: #cbd5e1;
      margin-bottom: 20px;
      font-size: 14px;
    }

    #video {
      width: 100%;
      border-radius: 14px;
      background: black;
      display: none;
      margin-bottom: 15px;
      object-fit: cover;
    }

    .status {
      margin: 15px 0;
      font-size: 14px;
      color: #93c5fd;
      min-height: 20px;
    }

    button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #1d4ed8;
    }

    button:disabled {
      background: #475569;
      cursor: not-allowed;
    }

    .success {
      color: #4ade80;
    }

    .error {
      color: #f87171;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Gate Security System</h1>

    <p>Aaryan's House</p>

    <video
      id="video"
      autoplay
      playsinline
      muted
    ></video>

    <canvas
      id="canvas"
      style="display: none;"
    ></canvas>

    <div
      id="status"
      class="status"
    >
      Ready to scan guest.
    </div>

    <button id="scanBtn">
      Scan Guest
    </button>

  </div>

  <script type="module">

    // =====================================================
    // FIREBASE IMPORTS
    // =====================================================

    import { initializeApp }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getFirestore,
      collection,
      addDoc
    }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // =====================================================
    // FIREBASE CONFIG
    // =====================================================

    const firebaseConfig = {
      apiKey: "AIzaSyBuYYn6V3jqUs47fnVfW1OlCywfyDX6ix0",
      authDomain: "gatepass-saas.firebaseapp.com",
      projectId: "gatepass-saas",
      storageBucket: "gatepass-saas.appspot.com",
      messagingSenderId: "788886920648",
      appId: "1:788886920648:web:acf750800bf8a5b0b4f4fd"
    };

    // =====================================================
    // FIREBASE INIT
    // =====================================================

    const app = initializeApp(firebaseConfig);

    const db = getFirestore(app);

    // =====================================================
    // DOM ELEMENTS
    // =====================================================

    const scanBtn = document.getElementById("scanBtn");

    const video = document.getElementById("video");

    const canvas = document.getElementById("canvas");

    const statusText = document.getElementById("status");

    // =====================================================
    // GLOBAL VARIABLES
    // =====================================================

    let activeStream = null;

    let isProcessing = false;

    // =====================================================
    // HELPER
    // =====================================================

    function wait(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    function setStatus(message, type = "") {

      statusText.textContent = message;

      statusText.className = `status ${type}`;
    }

    // =====================================================
    // START CAMERA
    // =====================================================

    async function startCamera(mode = "environment") {

      try {

        // Extra cleanup before switching
        await stopCamera();

        const constraints = {
          audio: false,
          video: {
            facingMode: {
              ideal: mode
            },
            width: {
              ideal: 1280
            },
            height: {
              ideal: 720
            }
          }
        };

        const stream = await navigator.mediaDevices.getUserMedia(
          constraints
        );

        activeStream = stream;

        video.srcObject = stream;

        video.style.display = "block";

        await video.play();

        // Stabilization delay
        await wait(500);

        return stream;

      } catch (error) {

        console.error("Camera start failed:", error);

        throw error;
      }
    }

    // =====================================================
    // CAPTURE FRAME
    // =====================================================

    function captureFrame() {

      const ctx = canvas.getContext("2d");

      canvas.width = video.videoWidth || 1280;

      canvas.height = video.videoHeight || 720;

      ctx.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
      );

      return canvas.toDataURL(
        "image/jpeg",
        0.82
      );
    }

    // =====================================================
    // STOP CAMERA COMPLETELY
    // =====================================================

    async function stopCamera() {

      try {

        if (activeStream) {

          activeStream.getTracks().forEach(track => {

            try {
              track.stop();
            } catch (err) {
              console.warn(err);
            }

          });

        }

        video.pause();

        video.srcObject = null;

        video.removeAttribute("src");

        video.load();

        video.style.display = "none";

        activeStream = null;

        // Hardware release delay
        await wait(700);

      } catch (error) {

        console.error("Camera cleanup error:", error);
      }
    }

    // =====================================================
    // DATABASE SAVE
    // =====================================================

    async function saveGuestLog(
      rearSnapshotDataURL,
      frontSnapshotDataURL
    ) {

      await addDoc(
        collection(db, "logs"),
        {
          timestamp: new Date(),
          rearSnapshot: rearSnapshotDataURL,
          frontSnapshot: frontSnapshotDataURL,
          action: "Guest Entry"
        }
      );
    }

    // =====================================================
    // SAFE NOTIFICATION
    // =====================================================

    function triggerNotification() {

      // Completely decoupled from upload thread

      setTimeout(async () => {

        try {

          if (!("Notification" in window)) {
            return;
          }

          if (Notification.permission === "default") {

            await Notification.requestPermission();
          }

          if (Notification.permission === "granted") {

            new Notification(
              "Gate Alert!",
              {
                body: "Guest entry captured successfully.",
                icon: "https://cdn-icons-png.flaticon.com/512/6195/6195700.png",
                silent: false
              }
            );
          }

        } catch (error) {

          console.error(
            "Notification error:",
            error
          );
        }

      }, 800);
    }

    // =====================================================
    // MAIN FLOW
    // =====================================================

    async function handleGuestScan() {

      if (isProcessing) return;

      isProcessing = true;

      scanBtn.disabled = true;

      let rearSnapshot = null;

      let frontSnapshot = null;

      try {

        // =================================================
        // STEP 1 - REAR CAMERA
        // =================================================

        setStatus("Opening rear camera...");

        await startCamera("environment");

        setStatus("Scanning gate / QR...");

        await wait(2000);

        rearSnapshot = captureFrame();

        // =================================================
        // STEP 2 - STOP REAR CAMERA
        // =================================================

        setStatus("Closing rear camera...");

        await stopCamera();

        // =================================================
        // STEP 3 - FRONT CAMERA
        // =================================================

        setStatus("Opening front camera...");

        await startCamera("user");

        setStatus("Capturing guest face...");

        await wait(1800);

        frontSnapshot = captureFrame();

        // =================================================
        // STEP 4 - STOP FRONT CAMERA
        // =================================================

        setStatus("Releasing camera hardware...");

        await stopCamera();

        // =================================================
        // STEP 5 - NOTIFICATION
        // =================================================

        triggerNotification();

        // =================================================
        // STEP 6 - DATABASE UPLOAD
        // =================================================

        setStatus("Uploading to database...");

        await saveGuestLog(
          rearSnapshot,
          frontSnapshot
        );

        // =================================================
        // COMPLETE
        // =================================================

        setStatus(
          "Guest entry completed successfully.",
          "success"
        );

      } catch (error) {

        console.error(error);

        await stopCamera();

        setStatus(
          "Error: " +
          (error.message || "Execution failed."),
          "error"
        );

      } finally {

        isProcessing = false;

        scanBtn.disabled = false;
      }
    }

    // =====================================================
    // BUTTON EVENT
    // =====================================================

    scanBtn.addEventListener(
      "click",
      handleGuestScan
    );

  </script>

</body>
</html>
