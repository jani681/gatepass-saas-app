<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GatePass - Family Dashboard</title>
    <style>
        body { 
            background-color: #121212; 
            color: #ffffff; 
            font-family: 'Segoe UI', sans-serif; 
            margin: 0; 
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { color: #00adb5; margin-bottom: 5px; }
        .dashboard-card {
            background-color: #1e1e1e;
            padding: 20px;
            border-radius: 15px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
        }
        .status-badge {
            background-color: #ff4a4a;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 15px;
            animation: blink 1.5s infinite;
        }
        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        .snapshot-container {
            width: 100%;
            height: 250px;
            background-color: #333;
            border-radius: 10px;
            margin: 15px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .snapshot-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .info-text { color: #aaaaaa; font-size: 14px; margin: 5px 0; }
        .action-btn {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            box-shadow: 0 4px 10px rgba(40, 167, 69, 0.3);
        }
        .action-btn:active { transform: scale(0.98); }
        .no-data { color: #888; font-style: italic; }
    </style>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>
<body>

    <div class="header">
        <h1>Iqbal House Dashboard 🏠</h1>
        <p>Ghar Walon Ki Live Screen</p>
    </div>

    <div class="dashboard-card" id="alertCard">
        <div id="statusBadge" class="status-badge" style="display: none;">🚨 LIVE VISITOR</div>
        
        <div class="snapshot-container" id="snapContainer">
            <p class="no-data" id="waitingText">Bahar koi nahi hai. Waiting for bell... 🕒</p>
            <img id="visitorImg" src="" style="display: none;" />
        </div>

        <div id="visitorInfo" style="text-align: left; padding: 0 10px;">
            <p class="info-text"><strong>Gate:</strong> <span id="gateName">-</span></p>
            <p class="info-text"><strong>Time:</strong> <span id="bellTime">-</span></p>
        </div>

        <button class="action-btn" id="openBtn" onclick="openGate()" style="display: none;">✅ OPEN GATE</button>
    </div>

    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBuYYn6V3jqUs47fnVfW1OlCywfyDX6ix0",
            authDomain: "gatepass-saas.firebaseapp.com",
            projectId: "gatepass-saas",
            storageBucket: "gatepass-saas.firebasestorage.app",
            messagingSenderId: "788886920648",
            appId: "1:788886920648:web:acf750800bf8a5b0b4f4fd"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let currentActiveDocId = null;

        // 🧠 Simplified Real-Time Listener: Bina kisi indexing error ke logs read karega
        db.collection("logs")
          .onSnapshot((snapshot) => {
              let activeAlert = null;

              // Saare documents check karke active ringing bell nikalna
              snapshot.forEach((doc) => {
                  const data = doc.data();
                  if (data.status === "ringing") {
                      activeAlert = { id: doc.id, ...data };
                  }
              });

              if (activeAlert) {
                  currentActiveDocId = activeAlert.id;

                  // Dashboard UI ko update karna
                  document.getElementById("statusBadge").style.display = "inline-block";
                  document.getElementById("waitingText").style.display = "none";
                  
                  const imgElement = document.getElementById("visitorImg");
                  imgElement.src = activeAlert.snapshot;
                  imgElement.style.display = "block";

                  document.getElementById("gateName").innerText = activeAlert.gate;
                  document.getElementById("bellTime").innerText = activeAlert.timestamp;
                  document.getElementById("openBtn").style.display = "block";
              } else {
                  // Agar koi active ringing bell nahi hai to reset kar do
                  resetDashboard();
              }
          }, (error) => {
              console.error("Snapshot error: ", error);
          });

        function resetDashboard() {
            currentActiveDocId = null;
            document.getElementById("statusBadge").style.display = "none";
            document.getElementById("waitingText").style.display = "block";
            document.getElementById("visitorImg").style.display = "none";
            document.getElementById("gateName").innerText = "-";
            document.getElementById("bellTime").innerText = "-";
            document.getElementById("openBtn").style.display = "none";
        }

        function openGate() {
            if (currentActiveDocId) {
                // Database mein status ko updated kar dena taake dashboard normal ho jaye
                db.collection("logs").doc(currentActiveDocId).update({
                    status: "opened"
                })
                .then(() => {
                    alert("Gate opened! Alert cleared.");
                    resetDashboard();
                })
                .catch((error) => {
                    console.error("Error updating status: ", error);
                });
            }
        }
    </script>
</body>
</html>
