<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Resident Dashboard</title>
    <style>
        :root {
            --bg: #050505;
            --surface: #111111;
            --accent: #00f2fe;
            --danger: #ff4d4d;
            --text: #ffffff;
            --text-muted: #71717a;
            --border: #222222;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 1rem;
        }

        .dash-container { max-width: 500px; margin: 0 auto; }

        /* Header */
        header { 
            padding: 1rem 0; 
            border-bottom: 1px solid var(--border); 
            margin-bottom: 2rem; 
        }
        .header-title { font-size: 1.25rem; font-weight: 700; color: var(--accent); }

        /* Visitor Alert Card */
        .alert-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .badge {
            display: inline-block;
            background: var(--danger);
            color: white;
            font-size: 0.7rem;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            text-transform: uppercase;
            font-weight: 800;
            margin-bottom: 1rem;
        }

        .snapshot-container {
            width: 100%;
            height: 250px;
            background: #000;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1rem;
            border: 1px solid var(--border);
            color: #333;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            font-size: 0.9rem;
        }
        .info-label { color: var(--text-muted); display: block; font-size: 0.7rem; }

        /* Empty State */
        .empty-dash {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-muted);
        }

        /* Action Buttons */
        .btn-action {
            width: 100%;
            padding: 1rem;
            margin-top: 1.5rem;
            background: var(--accent);
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="dash-container">
    <header>
        <div class="header-title">Resident Monitor</div>
        <div style="font-size: 0.8rem; color: var(--text-muted);">Gate System: Active</div>
    </header>

    <div id="alertArea">
        <div class="empty-dash">
            No active visitor alerts.
        </div>
    </div>
</div>

<script>
    /**
     * Future Logic Placeholders:
     * 1. Initialize listener for incoming logs
     * 2. Trigger notification/audio on new log
     * 3. Render card dynamically
     */
    console.log("Dashboard UI loaded. Ready for Firestore integration.");
</script>

</body>
</html>
